name: Migration Author Lease

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  verify:
    name: Migration author lease
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The coordination suites run here because they share the same functions this
      # job is about: work-dependencies backs the queue's dependency proof, and the
      # scenario table exercises the conflict matrix, contracts and events together.
      - name: Run coordination and orchestrator-flow tests
        shell: bash
        run: |
          shopt -s nullglob
          flow_tests=(scripts/orchestrator-flow/*.test.mjs)
          if (( ${#flow_tests[@]} == 0 )); then
            echo "No orchestrator-flow tests found" >&2
            exit 1
          fi
          required=(scripts/orchestrator-flow/baseline-schema.test.mjs scripts/orchestrator-flow/capacity-state.test.mjs scripts/orchestrator-flow/coordination-audit.test.mjs scripts/orchestrator-flow/evidence-bundle.test.mjs scripts/orchestrator-flow/classify-invalidation.test.mjs scripts/orchestrator-flow/read-preview-ledger.test.mjs scripts/orchestrator-flow/preview-graph.test.mjs scripts/orchestrator-flow/select-preview-route.test.mjs scripts/orchestrator-flow/reviewer-allocation.test.mjs scripts/orchestrator-flow/qualify-change.test.mjs scripts/orchestrator-flow/reconcile.test.mjs scripts/orchestrator-flow/throughput-report.test.mjs)
          for test_file in "${required[@]}"; do
            [[ -f "$test_file" ]] || { echo "Missing required orchestrator-flow test: $test_file" >&2; exit 1; }
          done
          printf 'Required orchestrator-flow test: %s\n' "${required[@]}"
          node --test scripts/check-migration-pr-lease.test.mjs scripts/check-exact-head-approval.test.mjs scripts/check-migration-ledger-drift.test.mjs scripts/check-worktree-freshness.test.mjs scripts/manage-migration-author-lanes.test.mjs scripts/historical-migration-restorations.test.mjs scripts/lib/work-dependencies.test.mjs scripts/lib/review-verdict-artifact.test.mjs scripts/lib/documents-only-change.test.mjs scripts/agent-work-contract.test.mjs scripts/db-coordination-events.test.mjs scripts/coordination-scenarios.test.mjs scripts/lib/exclusive-lease.test.mjs scripts/apply-lane-advisory-lock.test.mjs scripts/record-review-verdict.test.mjs scripts/run-governed-review.test.mjs "${flow_tests[@]}"
      - name: Require a valid branch-bound claim and permanent version reservation
        id: lease_check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result="$(node scripts/check-migration-pr-lease.mjs)"
          echo "$result"
          if [ "$result" = 'No migration files changed; claim check is not applicable.' ] || \
             [ "$result" = 'Migration code-truth restoration verified; claim check is not applicable.' ]; then
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          fi
      # Every pull request receives merge authorization only inside
      # guarded-migration-merge.yml. That workflow acquires the merge lane at
      # the actual merge point, where an active production lock can refuse it.
      # Auto-authorizing a non-migration head here left a green status that
      # survived a production lock acquired later (#1688).
