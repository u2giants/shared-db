# Guard: no NEW email-shaped personal identifiers enter this PUBLIC repository.
#
# Why this workflow exists (added 2026-08-09, AGENTS.md §6.14).
#
# `u2giants/shared-db` is a public repository. On 2026-08-09 a sweep found personal data
# committed on `main`: work email addresses in migrations and docs, a person's full name in
# a migration header, and several hundred third-party vendor contact records inside a
# committed verification baseline. The owner ruled: "Remove it going forward and accept the
# old copies exist." History rewriting was explicitly rejected, and the migrations are
# already applied, so they cannot be edited.
#
# This job is one deliberately partial mechanical control for that ruling. It does not
# verify names, phone numbers, addresses, or every other personal identifier; those remain
# review responsibilities. Its visible name and output must never imply full §6.14 coverage.
#
# WHAT IT CHECKS, precisely:
#   Only the lines this pull request ADDS, computed from the merge base with the base branch.
#   It never reads the rest of the file and never walks the tree. Every pre-existing
#   occurrence — including the two untouchable migrations and the verification baseline — is
#   therefore invisible to it by construction, exactly as AGENTS.md §6.14 requires.
#
# WHY EMAIL-SHAPE ONLY:
#   An email address has an unambiguous machine-detectable shape, so the check is
#   deterministic with a near-zero false-positive rate. Personal NAMES have no such shape;
#   any "name detector" would be a guessing game that fires on `core.person` seed rows,
#   which AGENTS.md §6.14 explicitly permits. A noisy guard gets bypassed and then ignored,
#   which is worse than no guard. Names remain a review responsibility, not a CI one.
#
# ALLOWED, because these are not personal identifiers:
#   - `*.noreply.github.com` (the mandated commit identity)
#   - `*.iam.gserviceaccount.com` and other robot/service-account addresses
#   - the reserved documentation domains (example.com/net/org, *.invalid, *.test, localhost)
#   - obvious placeholders (user@, you@, someone@, name@, email@)
#
# Design rules, same as the other repo-wide guards here:
#   1. NO `paths:` filter. A filtered job skips on exactly the PR that needs it and still
#      reports all-checks-passed (AGENTS.md §5.2).
#   2. A UNIQUE check-run name, so it can be made a required context (AGENTS.md §6.7).
#   3. Its own negative-path tests run FIRST, in the same job. A guard whose tests are not
#      run is a guard nobody has proven fires.
#   4. Offline and deterministic. No secrets, no network, no database.
#
# ESCAPE HATCH: put the `pii-guard-allow` label on the PR when an added address is genuinely
# a service account the allowlist does not know. Deliberate, visible, and reviewable.

name: Email Address Forward Guard (Partial PII Coverage)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pii-forward-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Email-address forward guard (partial PII coverage)
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the detector and its tests
        run: |
          mkdir -p "$RUNNER_TEMP/piiguard"
          cat > "$RUNNER_TEMP/piiguard/detect.mjs" <<'DETECTOR_EOF'
          // Detects email-shaped strings in ADDED diff lines only.

          const EMAIL = /[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/g;

          const ALLOWED_DOMAIN_SUFFIX = [
            'noreply.github.com',
            'gserviceaccount.com',
            'example.com',
            'example.net',
            'example.org',
            '.invalid',
            '.test',
            '.local',
            '.localhost',
          ];

          const ALLOWED_LOCALPART = new Set([
            'user', 'users', 'you', 'your', 'someone', 'somebody', 'name', 'email',
            'e-mail', 'mail', 'test', 'tests', 'example', 'placeholder', 'foo', 'bar',
            'noreply', 'no-reply', 'donotreply', 'do-not-reply', 'admin', 'root',
          ]);

          export function findViolations(addedLines) {
            const hits = [];
            for (const { file, line, text } of addedLines) {
              for (const match of text.match(EMAIL) ?? []) {
                const at = match.lastIndexOf('@');
                const local = match.slice(0, at).toLowerCase();
                const domain = match.slice(at + 1).toLowerCase();

                if (ALLOWED_LOCALPART.has(local)) continue;
                if (ALLOWED_DOMAIN_SUFFIX.some((s) => domain === s || domain.endsWith('.' + s) || domain.endsWith(s))) continue;
                // A version or scope token, not an address: `@v4`, `@1.2.3`.
                if (/^[0-9]/.test(domain)) continue;

                hits.push({ file, line, domain });
              }
            }
            return hits;
          }

          // Parse a unified diff, returning only ADDED lines with their file and new-file
          // line number. Deletions and context are ignored, so REMOVING an existing
          // occurrence can never fail this check.
          export function parseAddedLines(diff) {
            const out = [];
            let file = null;
            let lineNo = 0;
            for (const raw of diff.split('\n')) {
              if (raw.startsWith('+++ b/')) { file = raw.slice(6); continue; }
              if (raw.startsWith('+++ ')) { file = null; continue; }
              const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(raw);
              if (hunk) { lineNo = Number(hunk[1]); continue; }
              if (raw.startsWith('---')) continue;
              if (raw.startsWith('+')) {
                if (file) out.push({ file, line: lineNo, text: raw.slice(1) });
                lineNo += 1;
              } else if (raw.startsWith('-') || raw.startsWith('\\')) {
                // deletion or "no newline" marker: does not advance the new-file counter
              } else {
                lineNo += 1;
              }
            }
            return out;
          }
          DETECTOR_EOF

          cat > "$RUNNER_TEMP/piiguard/detect.test.mjs" <<'TEST_EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { findViolations, parseAddedLines } from './detect.mjs';

          // Fixture addresses are ASSEMBLED AT RUNTIME and never written as a literal.
          // As literals they would make this guard flag its own file on every pull request
          // that touches it, and a guard that fails its own PR gets deleted.
          const AT = String.fromCharCode(64);
          const NL = String.fromCharCode(10);
          const work = (u) => u + AT + 'popcre.com';
          const personal = (u) => u + AT + 'gmail.com';

          const diff = (...added) => [
            'diff --git a/f.md b/f.md',
            '--- a/f.md',
            '+++ b/f.md',
            '@@ -1,1 +1,3 @@',
            ...added,
          ].join(NL) + NL;

          test('FIRES on a newly added work email address', () => {
            const hits = findViolations(parseAddedLines(diff('+-- owner: ' + work('person.one'))));
            assert.equal(hits.length, 1);
            assert.equal(hits[0].domain, 'popcre.com');
          });

          test('FIRES on a newly added personal email address', () => {
            const hits = findViolations(parseAddedLines(diff('+contact: ' + personal('someuser123'))));
            assert.equal(hits.length, 1);
          });

          test('does NOT fire on a REMOVED email address', () => {
            assert.deepEqual(findViolations(parseAddedLines(diff('--- owner: ' + work('person.one')))), []);
          });

          test('does NOT fire on an unchanged context line', () => {
            assert.deepEqual(findViolations(parseAddedLines(diff(' -- owner: ' + work('person.one')))), []);
          });

          test('allows the mandated commit identity', () => {
            const id = 'u2giants' + AT + 'users.noreply.github.com';
            assert.deepEqual(findViolations(parseAddedLines(diff('+Co-Authored-By: X <' + id + '>'))), []);
          });

          test('allows GCP service accounts', () => {
            const sa = 'sa-planning-proxy' + AT + 'lithe-breaker-323913.iam.gserviceaccount.com';
            assert.deepEqual(findViolations(parseAddedLines(diff('+' + sa))), []);
          });

          test('allows documentation placeholders', () => {
            assert.deepEqual(findViolations(parseAddedLines(diff('+email = ' + 'user' + AT + 'example.com'))), []);
          });

          test('does not fire on npm scopes or action versions', () => {
            const lines = ['+  - uses: actions/checkout@v4', '+import x from "@types/node";'];
            assert.deepEqual(findViolations(parseAddedLines(diff(...lines))), []);
          });

          test('reports the correct new-file line number', () => {
            const hits = findViolations(parseAddedLines(diff('+ok', '+bad ' + work('person.two'))));
            assert.equal(hits.length, 1);
            assert.equal(hits[0].line, 2);
          });
          TEST_EOF

          cat > "$RUNNER_TEMP/piiguard/run.mjs" <<'RUN_EOF'
          import fs from 'node:fs';
          import { findViolations, parseAddedLines } from './detect.mjs';

          const hits = findViolations(parseAddedLines(fs.readFileSync(process.argv[2], 'utf8')));

          if (hits.length === 0) {
            console.log('OK: this pull request adds no email-shaped personal identifier. PARTIAL COVERAGE ONLY: names, phone numbers, addresses, and other identifiers were not checked.');
            process.exit(0);
          }

          // Deliberately does NOT print the address itself. This repository is public and
          // so is this log; echoing the value would widen the very disclosure the guard
          // exists to prevent. File, line and domain are enough to find it locally.
          console.error('This pull request ADDS email-shaped personal identifier(s) to a PUBLIC repository.');
          console.error('AGENTS.md section 6.14: refer to people by app.profile UUID only.');
          console.error('');
          for (const h of hits) {
            console.error('  ' + h.file + ':' + h.line + '  (an email address at domain ' + h.domain + ')');
          }
          console.error('');

          const labels = JSON.parse(process.env.PR_LABELS || '[]');
          if (labels.includes('pii-guard-allow')) {
            console.error('Label `pii-guard-allow` is present: passing as a reviewed exception.');
            process.exit(0);
          }

          console.error('Fix: remove the address, or use the profile UUID instead. If it is');
          console.error('genuinely a service account, add its domain to the allowlist in');
          console.error('.github/workflows/pii-forward-guard.yml, or apply the');
          console.error('`pii-guard-allow` label as a reviewed exception.');
          process.exit(1);
          RUN_EOF

      - name: Prove the guard fires, and prove it ignores pre-existing lines
        run: node --test "$RUNNER_TEMP/piiguard/detect.test.mjs"

      - name: Scan only the lines this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "Scanning added lines between $MERGE_BASE and $HEAD_SHA"
          git diff --unified=0 "$MERGE_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/piiguard/pr.diff"
          node "$RUNNER_TEMP/piiguard/run.mjs" "$RUNNER_TEMP/piiguard/pr.diff"
