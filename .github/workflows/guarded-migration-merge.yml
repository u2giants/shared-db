name: Guarded Migration Merge

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Migration pull request number"
        required: true
        type: string
      head_sha:
        description: "Exact reviewed pull request head SHA"
        required: true
        type: string

concurrency:
  group: shared-db-guarded-merge
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write
  statuses: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install coordination guard tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Require current main and rerun every coordination guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          bash scripts/check-sql.sh
          node scripts/check-pr-object-collisions.mjs
          node scripts/check-migration-pr-lease.mjs
      - name: Acquire the exclusive merge lane
        id: merge_lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/manage-migration-author-lanes.mjs --acquire-merge \
            --owner "github-actions:${GITHUB_RUN_ID}" --pr "${{ inputs.pull_request }}" \
            --head-sha "${{ inputs.head_sha }}" > "$RUNNER_TEMP/merge-lock.json"
          echo "owner_sha=$(jq -r .ownerSha "$RUNNER_TEMP/merge-lock.json")" >> "$GITHUB_OUTPUT"
      - name: Re-prove the head and merge while the lock is held
        id: guarded_merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(gh pr view '${{ inputs.pull_request }}' --repo u2giants/shared-db --json headRefOid --jq .headRefOid)" = "$REQUESTED_SHA"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          node scripts/check-pr-object-collisions.mjs
          node scripts/check-migration-pr-lease.mjs
          gh api "repos/u2giants/shared-db/statuses/$REQUESTED_SHA" -f state=success -f context='Migration guarded merge authorization' -f description='Exclusive merge lock held and exact head revalidated'
          gh pr merge "${{ inputs.pull_request }}" --repo u2giants/shared-db --merge --match-head-commit "${{ inputs.head_sha }}"
      - name: Revoke authorization if the guarded merge did not complete
        id: revoke_authorization
        if: failure() && steps.merge_lock.outputs.owner_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
        run: gh api "repos/u2giants/shared-db/statuses/$REQUESTED_SHA" -f state=failure -f context='Migration guarded merge authorization' -f description='Guarded merge failed; authorization revoked before lock release'
      - name: Release the exclusive merge lane with ownership proof
        if: always() && steps.merge_lock.outputs.owner_sha != '' && (steps.guarded_merge.outcome == 'success' || steps.revoke_authorization.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_SHA: ${{ steps.merge_lock.outputs.owner_sha }}
        run: node scripts/manage-migration-author-lanes.mjs --release-merge --owner-sha "$OWNER_SHA"
