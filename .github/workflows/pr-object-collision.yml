# CROSS-PR OBJECT COLLISION GUARD — HANDOFF.md backlog item B6.
#
# WHY IT EXISTS: on 2026-07-31 four independent sessions each authored a
# migration doing `create or replace function plm.promote_coldlion_source_owned`.
# `create or replace` is last-writer-wins, so merging any two would have silently
# erased the other. All four passed CI, because scripts/check-sql.sh only ever
# sees one branch at a time. This workflow is the only check that looks across
# open pull requests.
#
# WHY THERE IS NO `paths:` FILTER — read AGENTS.md §5.2 before adding one.
#
#   The checker inspects OTHER pull requests' migration files, not just this
#   one's. There is therefore no set of paths in THIS pull request that
#   determines whether the check is relevant: PR #A can become a collision the
#   moment PR #B is opened, without PR #A changing at all. A `paths:` filter
#   would produce exactly the §5.2 failure — a stale verdict that cannot be
#   re-run, because the fix (or the collision) lives in a different branch.
#   Same design rule as .github/workflows/backlog-queue-sync.yml and
#   .github/workflows/tools-offline-tests.yml. The job is a few seconds of Node
#   plus a handful of read-only API calls; there is nothing to optimise.
#
# LIMITS OF THE TRIGGER, stated honestly: `pull_request` fires on this PR's own
# events (opened/synchronize/reopened) and `workflow_dispatch` allows a manual
# re-run. GitHub will NOT re-run a green check because a SIBLING pull request
# appeared afterwards. The last member of a colliding set to merge is therefore
# the one that must be re-checked.
#
# WHAT ACTUALLY PROVIDES THAT RE-CHECK — corrected 2026-08-23, issue #1366.
# THIS JOB IS A DETECTOR, NOT THE GATE. Earlier text here said the re-check came
# from branch protection's "require branches to be up to date before merging"
# (`required_status_checks.strict`). That is NOT how this repository works and
# reading it that way has already produced one unsafe change proposal.
#
#   * `required_status_checks.strict` is deliberately FALSE. Albert ruled this on
#     2026-08-19 in issue #1286, after strict mode restarted the full check suite
#     on every branch after every unrelated merge, costing roughly 50 minutes a
#     day. It is an owner-authorized throughput decision, NOT configuration drift.
#     Do not "fix" it. Issue #1286 alone governs whether it is ever reconsidered.
#
#   * The real re-check for a MIGRATION pull request is
#     `.github/workflows/guarded-migration-merge.yml`, whose required context
#     `Migration guarded merge authorization` re-runs collision and lease
#     validation against a head that already contains current `main`, and does so
#     while holding the merge lock.
#
#   * A pull request with NO migrations is auto-authorized by
#     `.github/workflows/migration-author-lease.yml`, because there is no
#     structural collision for it to have.
#
# So: this guard gives early feedback to honest authors; guarded merge is what
# actually holds the line at merge time.
#
# NO DATABASE CONTACT: this job reads GitHub pull-request metadata and committed
# .sql text. It needs no database credentials and must never be given any.

name: Cross-PR Object Collision

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-object-collision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Cross-PR object collision
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # B7: the guard ships with a test that COMMITS THE VIOLATION (a replay of
      # the real four-way collision) and asserts the guard fails on it.
      - name: Unit-test the checker itself (includes the negative path)
        run: node --test scripts/check-pr-object-collisions.test.mjs

      # The DISPATCH-time checker imports extractObjects from the script above,
      # so a change to that parser can silently break it. Both suites run in
      # this one job precisely so they cannot drift apart. This step adds no new
      # required status context -- the job name is unchanged.
      - name: Unit-test the dispatch-time collision checker (shares the parser)
        run: node --test scripts/check-dispatch-collision.test.mjs scripts/check-pr-source-collisions.test.mjs scripts/manage-migration-author-lanes.test.mjs

      - name: No earlier open PR edits the same protected coordination source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-pr-source-collisions.mjs

      - name: No other open PR replaces the same database object
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-object-collisions.mjs
