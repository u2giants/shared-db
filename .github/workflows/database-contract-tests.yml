# Executes every contract test in supabase/tests/ against a THROWAWAY database.
#
# WHY THIS WORKFLOW EXISTS (issues #695 and #731)
# ----------------------------------------------
# Until this file, NOTHING in .github/workflows executed supabase/tests/. Forty
# contract-test files -- the ones that assert BEHAVIOUR rather than "the migration
# applied" -- were enforced only by whoever remembered to run them by hand against
# preview. A test that is never run is indistinguishable from a test that passes,
# right up until production. #695 recorded that. #731 recorded that two suites
# merged in one session had never executed even once.
#
# WHAT IT RUNS AGAINST
# --------------------
# A LOCAL, EPHEMERAL Supabase stack (`supabase db start`) created fresh inside the
# runner and thrown away with it. Every migration in supabase/migrations/ is applied
# to it from empty, so the schema under test is the repo's own definition of itself.
#
#   IT MUST NEVER POINT AT PREVIEW (rjyboqwcdzcocqgmsyel) OR PRODUCTION
#   (qsllyeztdwjgirsysgai). There is no SUPABASE_ACCESS_TOKEN, no
#   SUPABASE_DB_PASSWORD_* and no `supabase link` in this workflow, and none may be
#   added. These tests write and roll back; run against a shared database from a pull
#   request, that is a mutation of shared state driven by unreviewed code.
#
# NO `paths:` FILTER, ON PURPOSE (AGENTS.md 5.2). A path-filtered guard reports a
# stale green: a change outside the filter skips the job and the pull request still
# shows all-checks-passed. The tests read across the whole of supabase/migrations,
# so no honest filter exists.
#
# THE FILE LIST IS A GLOB, NOT A LIST. That is the specific defect #731 is about --
# `shared-supabase-migrations.yml` names its Python test files explicitly and a new
# one merged without anybody remembering to add it. A new supabase/tests/*.sql file
# is wired into CI the moment it is committed.
#
# THE PRE-ADOPTION BASELINE AND THE FIXTURE SEED (issue #754)
# -----------------------------------------------------------
# The repository's migration history is NOT self-contained -- it was adopted on top of
# an already-populated database. A bare from-empty replay applied 363 of 429 migrations
# and 26 of 40 contract tests could not run at all. Two artifacts in
# supabase/ci-bootstrap/ close that gap, and NEITHER is a migration:
#
#   010_pre_adoption_baseline.sql -- the SCHEMA ONLY of every relation that exists in
#     production but that no migration here creates. Captured read-only. No rows.
#   020_test_fixture_seed.sql -- the handful of reference rows the db_data_admin suite
#     and its siblings need. Entirely INVENTED: `ZZ Fixture` names, `.invalid` emails.
#
# They are applied in a TWO-PASS replay: pass 1 replays everything and records failures,
# the baseline lands, pass 2 re-runs only the failures. Both passes print their counts,
# so the size of the remaining gap is a number on every run rather than a footnote.
#
# QUARANTINE. Some files assert facts that are true only of a long-lived deployed
# database (grants made by hand, seeded reference rows, environment pins) and cannot
# hold on a from-empty ephemeral one. Those are listed in tests/ci-quarantine.txt
# with a REASON each; they are still executed and their output is still printed, but
# their result does not fail the job. The list is printed in the summary on every run
# so it can never quietly grow. Nothing may be added to it to make a red job green
# without the reason being written down. And the list itself is policed: a line naming
# a file that no longer exists FAILS the job, and a quarantined file that PASSES is
# reported as a warning telling you to take it off the list. A quarantine entry that
# matches nothing is exactly the kind of green-but-inert check #731 exists to kill.

name: Database Contract Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: supabase/tests against an ephemeral database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # This is a STATIC self-check of this workflow file, not a runtime read of the
      # environment. The first version of this step mapped the three secrets into `env:`
      # so it could test whether they were empty -- which is precisely how a secret gets
      # into a job's scope, so it failed itself on the first run. The lesson generalises:
      # you cannot prove a credential is absent by asking for it. Read the file instead.
      - name: Refuse to run if this workflow can reach a shared database
        run: |
          set -euo pipefail
          SELF=.github/workflows/database-contract-tests.yml
          # `secrets.` anywhere in this file, the preview or production project refs, or a
          # `supabase link` all mean this job is no longer confined to a throwaway
          # database. The pattern is written split so that this guard does not match its
          # own source line.
          if grep -nE '\$\{\{ *secrets\.' "$SELF"; then
            echo "::error::$SELF references a secret. This job must only ever touch a local throwaway database." >&2
            exit 1
          fi
          # Built from PIECES so that this line does not match itself -- the first attempt
          # wrote the refs out in full and the guard failed on its own source.
          PAT="rjybo""qwcdzcocqgmsyel|qsllye""ztdwjgirsysgai|supabase +link"
          if grep -nE "$PAT" "$SELF" | grep -vE '^[0-9]+:\s*#'; then
            echo "::error::$SELF names a shared project ref or links to one outside a comment." >&2
            exit 1
          fi
          # And prove nothing upstream leaked one in anyway.
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD_PREVIEW SUPABASE_DB_PASSWORD_PRODUCTION SUPABASE_DB_URL; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set in a job that must only ever touch a local throwaway database." >&2
              exit 1
            fi
          done
          echo "Confined to a local ephemeral database: no secrets, no shared project ref, no link."

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Ensure a working PostgreSQL client (psql)
        run: |
          set -euo pipefail

          # WHY THIS IS NOT JUST `apt-get install postgresql-client` (issue #1261)
          # ---------------------------------------------------------------------
          # The hosted runner image ALREADY ships a PostgreSQL client, so the apt
          # install was buying nothing and risking everything. On 2026-08-19 a stalled
          # `apt-get update` against azure.archive.ubuntu.com consumed an entire
          # 45-minute job budget five times across three PRs; every later step was
          # skipped, so NOT ONE LINE OF SQL RAN -- and it surfaced as a plain red X,
          # indistinguishable from a genuine failure. That is the hosted-runner
          # starvation mode described in AGENTS.md 5.2-A.
          #
          # So: prove the client FIRST and skip apt entirely when it is already there;
          # if apt is genuinely needed, bound every command with `timeout` and retry
          # with backoff; and if a working client still cannot be had, fail FAST and
          # BY NAME so nobody mistakes an infrastructure stall for a fault in the
          # change under review. This step never continues without a real client --
          # failing loudly is the point.
          if command -v psql >/dev/null 2>&1 && psql --version; then
            echo "psql already present on the runner image; no apt install needed."
            exit 0
          fi

          echo "::warning::psql absent from the runner image; falling back to apt."
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if timeout --kill-after=10 60 sudo apt-get update \
              && timeout --kill-after=10 120 sudo apt-get install -y --no-install-recommends postgresql-client; then
              if command -v psql >/dev/null 2>&1 && psql --version; then
                echo "psql installed and proved working on attempt ${i}."
                exit 0
              fi
            fi
            echo "::warning::psql install attempt ${i} of ${attempts} failed or timed out."
            # No backoff after the LAST attempt: it would only delay the
            # named error below by a further 30s. The worst-case budget is
            # 3*(60+120)+10+20 = 570s, which must stay inside the TIGHTEST
            # job ceiling that runs this block (`reconcile`, 15 minutes).
            # Shorten the budget, never raise the ceiling -- a generic job
            # timeout would swallow the named diagnostic exactly when it
            # is needed, which is the whole defect of #1261.
            if [ "$i" -lt "$attempts" ]; then
              sleep $(( i * 10 ))
            fi
          done

          echo "::error::CI INFRASTRUCTURE: PostgreSQL client unavailable after ${attempts} attempts (apt mirror stall on the hosted runner -- NOT a fault in the change under review); NO TEST WAS EXECUTED"
          exit 1

      # WHY THE MIGRATIONS ARE MOVED ASIDE FIRST
      # ----------------------------------------
      # `supabase db start` applies supabase/migrations itself, and STOPS DEAD on the
      # first file that fails. Run that way, this job reports exactly one broken
      # migration per CI run and tells you nothing at all about the contract tests.
      #
      # That is not hypothetical. The first real run of this workflow died on
      # 20260702220336_ai_sentinel_stats_exact_match.sql with
      # `relation "assets" does not exist` -- the repository's migration history is NOT
      # self-contained, because some objects (`public.assets` among them) exist in the
      # deployed databases without any migration here having created them. From-empty
      # replay therefore cannot be assumed to reach the end.
      #
      # So the database is started EMPTY (with the Supabase roles and extensions the CLI
      # seeds) and every migration is then applied by psql in filename order, RECORDING
      # each failure and CONTINUING. One run then answers both questions at once: which
      # migrations cannot replay from empty, and which contract tests hold on whatever
      # schema that produces. Neither answer is hidden behind the other.
      - name: Start an empty ephemeral database
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/migrations"
          mv supabase/migrations/*.sql "$RUNNER_TEMP/migrations/"
          supabase db start 2>&1 | tee "$RUNNER_TEMP/db-start.log"

      - name: Prove atomic migration DDL and ledger commit or roll back together
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          ATOMIC_MIGRATION_POSTGRES_TEST: "1"
        run: python scripts/test_atomic_migration_apply_postgres.py

      - name: Prove preview ledger reconciliation rolls back an in-lock failure
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PREVIEW_LEDGER_RECONCILE_POSTGRES_TEST: "1"
        run: python scripts/test_preview_ledger_orphan_reconcile_postgres.py

      - name: Replay every migration, recording failures (pass 1)
        id: replay
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -uo pipefail
          shopt -s nullglob
          MIGS=("$RUNNER_TEMP"/migrations/*.sql)
          mkdir -p "$RUNNER_TEMP/migration-logs"
          OK=0; BAD=0
          : > "$RUNNER_TEMP/failed-migrations.txt"
          # THE LEDGER TABLE, because applying by psql instead of by the CLI means nothing
          # creates it. 20260723112940_dam_core_taxonomy_ledger_barrier.sql reads
          # supabase_migrations.schema_migrations and cannot work without it. Each file's
          # version is recorded as it lands, which is exactly what the CLI would record.
          psql -v ON_ERROR_STOP=1 --no-psqlrc -c \
            'create schema if not exists supabase_migrations;
             create table if not exists supabase_migrations.schema_migrations (
               version text primary key, statements text[], name text);' \
            > "$RUNNER_TEMP/ledger-init.log" 2>&1
          for m in "${MIGS[@]}"; do
            base="$(basename "$m")"
            # --single-transaction matches how the Supabase CLI applies a migration: the
            # file lands whole or not at all, so a half-applied file can never leave a
            # schema that no real database would ever have.
            if psql -v ON_ERROR_STOP=1 --no-psqlrc --single-transaction -f "$m" \
                 > "$RUNNER_TEMP/migration-logs/$base.log" 2>&1; then
              OK=$((OK+1))
              psql -q --no-psqlrc -c \
                "insert into supabase_migrations.schema_migrations (version, name)
                 values ('${base%%_*}', '$base') on conflict (version) do nothing;" \
                >> "$RUNNER_TEMP/ledger-init.log" 2>&1
            else
              BAD=$((BAD+1))
              echo "$base" >> "$RUNNER_TEMP/failed-migrations.txt"
              echo "::warning::migration did not replay from empty: $base"
            fi
          done
          # PUT THE MIGRATION FILES BACK before any test runs. At least one contract test
          # (owner_ruling_coco_is_a_disney_license_contracts.sql) READS ITS MIGRATION FROM
          # DISK with \set and refuses to run if the file loads empty. With the directory
          # still moved aside that test failed for a reason that had nothing to do with the
          # database -- a false failure is as bad as a false pass.
          mv "$RUNNER_TEMP"/migrations/*.sql supabase/migrations/
          echo "Pass 1 replayed ${#MIGS[@]} migrations: $OK applied, $BAD failed."
          {
            echo "## Migration replay, pass 1 (empty database, no baseline)"
            echo ""
            echo "| outcome | count |"
            echo "| --- | ---: |"
            echo "| migration files | ${#MIGS[@]} |"
            echo "| applied | $OK |"
            echo "| did NOT replay | $BAD |"
            echo ""
            if [ "$BAD" -gt 0 ]; then
              echo "A migration that cannot replay from empty is NOT necessarily broken in the"
              echo "deployed databases -- it usually means it depends on an object no migration in"
              echo "this repository creates. These are the ones the captured pre-adoption baseline"
              echo "exists to unblock; pass 2 below re-runs exactly this list."
              echo ""
              echo "<details><summary>Migrations that did not replay in pass 1</summary>"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/failed-migrations.txt"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # THE CAPTURED PRE-ADOPTION BASELINE (issue #754)
      # -----------------------------------------------
      # supabase/ci-bootstrap/010_pre_adoption_baseline.sql holds the SCHEMA ONLY of every
      # relation that exists in production but that no migration in this repository
      # creates -- public.assets, the legacy popdam tables, the plm.* legacy mirrors.
      # Without it a from-empty replay can never reach the starting point production
      # actually had, and two thirds of the contract tests can never run.
      #
      # WHY BETWEEN THE PASSES AND NOT BEFORE PASS 1. Some baseline columns are typed with
      # enums that 20260621150714_foundation.sql creates (app.entity_status). Applied
      # first, this file would have to create those types itself, and foundation's
      # unguarded CREATE TYPE would then fail -- trading one gap for a worse one. Applied
      # here, foundation has already run and every type exists.
      #
      # WHY IT IS NOT A MIGRATION. A file inserted at the front of an already-applied
      # sequence cannot re-run against preview or production, whose ledgers are long past
      # this point, and a back-dated version is precisely what the Guard B backdating
      # check exists to stop. The only consumer is a from-empty replay, which only ever
      # happens in this runner.
      - name: Apply the captured pre-adoption baseline
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          BOOT=supabase/ci-bootstrap/010_pre_adoption_baseline.sql
          if [ ! -f "$BOOT" ]; then
            echo "::error::$BOOT is missing. Without it this lane silently reverts to proving only the subset of the contract provable from the repository alone." >&2
            exit 1
          fi
          # NOT --single-transaction: this file is a snapshot, and one object that a future
          # migration starts creating itself must not discard the other 500. Failures are
          # counted and reported below.
          psql --no-psqlrc -f "$BOOT" > "$RUNNER_TEMP/baseline.log" 2>&1 || true
          BASE_ERR=$(grep -c '^psql:.*ERROR' "$RUNNER_TEMP/baseline.log" || true)
          echo "Baseline applied with $BASE_ERR statement error(s)."
          {
            echo "## Captured pre-adoption baseline"
            echo ""
            echo "\`$BOOT\` -- schema only, no rows. Statement errors: **$BASE_ERR**."
            echo ""
            if [ "$BASE_ERR" -gt 0 ]; then
              echo "TWO errors are EXPECTED and harmless: the baseline emits its functions twice"
              echo "because pg_proc returns them in name order, not dependency order, and"
              echo "claim_pdf_backfill_batch / count_pdf_backfill_remaining call"
              echo "is_style_guide_source_pdf. They fail on the first pass and land on the second."
              echo ""
              echo "MORE than two usually means a migration has started creating an object the"
              echo "baseline also creates. Delete it from the baseline rather than leaving both."
              echo ""
              echo "<details><summary>Baseline errors</summary>"
              echo ""
              echo '```'
              grep '^psql:.*ERROR' "$RUNNER_TEMP/baseline.log" | head -50 || true
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # PASS 2. Re-run ONLY the migrations that failed in pass 1, in filename order, now
      # that the objects they depend on exist. What still fails after this is the honest
      # residue: migrations whose precondition is deployed DATA (a specific Licensor, an
      # authoritative row count in a legacy mirror) rather than a missing object. Those
      # refusals are correct -- they are guards doing their job on a database that really
      # does not hold that data -- and the tests downstream of them stay quarantined with
      # that reason written down.
      - name: Re-run the migrations that failed, now on the baseline (pass 2)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/migration-logs-pass2"
          PASS1_BAD=$(wc -l < "$RUNNER_TEMP/failed-migrations.txt" | tr -d ' ')
          OK=0; BAD=0
          : > "$RUNNER_TEMP/failed-migrations-pass2.txt"
          while read -r base; do
            [ -n "$base" ] || continue
            m="supabase/migrations/$base"
            if [ ! -f "$m" ]; then
              echo "::error::pass 2 cannot find $m" >&2; BAD=$((BAD+1)); continue
            fi
            # Snapshot the LATER truth this older pass-2 file would overwrite, in both
            # of the ways it can: newer routine DEFINITIONS it would replace, and the
            # EXECUTE GRANTS of functions a schema-wide revoke inside it would strip
            # from objects created after it. Restoring a snapshot is safer than
            # re-running whole later migrations, which may contain guarded data or
            # other non-repeatable work.
            #
            # The grant half was added after api.set_source_resolution (#2085) failed
            # its own grant contract on this lane: 20260710135985_reconcile_permission_
            # parity.sql does not replay from empty, so it lands in pass 2 and its
            # `revoke execute on all functions in schema api from service_role` reached
            # roughly sixty api functions created months later. The migrations applied
            # cleanly and said nothing; only a contract test asserting a grant caught it.
            if ! SNAPSHOT_QUERY=$(python scripts/check_pass2_routine_supersession.py "$m" \
                 --migrations-dir supabase/migrations); then
              echo "::error::could not calculate pass-2 ordering repair for $base" >&2
              exit 2
            fi
            ROUTINE_SNAPSHOT=""
            if [ -n "$SNAPSHOT_QUERY" ]; then
              if ! ROUTINE_SNAPSHOT=$(psql -At --no-psqlrc -v ON_ERROR_STOP=1 -c "$SNAPSHOT_QUERY"); then
                echo "::error::could not snapshot later routine definitions before $base" >&2
                exit 2
              fi
            fi
            if psql -v ON_ERROR_STOP=1 --no-psqlrc --single-transaction -f "$m" \
                 > "$RUNNER_TEMP/migration-logs-pass2/$base.log" 2>&1; then
              # Pass 2 runs after every pass-1 success, so an older migration can
              # silently replace a routine installed by a later migration, or revoke
              # privileges from one. Restore exactly the newer routine definitions and
              # grants, without re-running the later migrations' unrelated DDL or
              # guarded data work.
              if [ -n "$ROUTINE_SNAPSHOT" ]; then
                echo "Restoring later routine definitions and grants after $base to preserve order."
                if ! printf '%s\n' "$ROUTINE_SNAPSHOT" | psql -v ON_ERROR_STOP=1 \
                     --no-psqlrc --single-transaction \
                     > "$RUNNER_TEMP/migration-logs-pass2/${base}__ORDER_REPAIR.log" 2>&1; then
                  echo "::error::pass-2 routine-definition restore failed after $base" >&2
                  exit 2
                fi
              fi
              OK=$((OK+1))
              psql -q --no-psqlrc -c \
                "insert into supabase_migrations.schema_migrations (version, name)
                 values ('${base%%_*}', '$base') on conflict (version) do nothing;" \
                >> "$RUNNER_TEMP/ledger-init.log" 2>&1
            else
              BAD=$((BAD+1))
              echo "$base" >> "$RUNNER_TEMP/failed-migrations-pass2.txt"
              echo "::warning::still does not replay after the baseline: $base"
            fi
          done < "$RUNNER_TEMP/failed-migrations.txt"
          echo "Pass 2: $OK of $PASS1_BAD now apply, $BAD still fail."
          {
            echo "## Migration replay, pass 2 (on the captured baseline)"
            echo ""
            echo "| outcome | count |"
            echo "| --- | ---: |"
            echo "| failed in pass 1 | $PASS1_BAD |"
            echo "| now apply | $OK |"
            echo "| STILL do not replay | $BAD |"
            echo ""
            if [ "$BAD" -gt 0 ]; then
              echo "<details><summary>Still failing after the baseline -- with the first error of each</summary>"
              echo ""
              echo '```'
              while read -r b; do
                [ -n "$b" ] || continue
                echo "--- $b"
                grep -m1 'ERROR' "$RUNNER_TEMP/migration-logs-pass2/$b.log" 2>/dev/null || echo "    (no ERROR line)"
              done < "$RUNNER_TEMP/failed-migrations-pass2.txt"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prove pass-2 routine restoration against live PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: python scripts/verify_pass2_routine_restoration_live.py

      # THE SYNTHETIC FIXTURE SEED (issue #754)
      # ---------------------------------------
      # Eleven contract tests assert RLS, grants, merge behaviour and read contracts, and
      # need a few reference rows merely to have something to act on. Every row in this
      # file is INVENTED -- `ZZ Fixture` names, `.invalid` email addresses. No production
      # row, no real person, customer, vendor, licensor or property is copied into it, and
      # none may ever be.
      - name: Apply the synthetic test-fixture seed
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          SEED=supabase/ci-bootstrap/020_test_fixture_seed.sql
          if [ ! -f "$SEED" ]; then
            echo "::error::$SEED is missing. The db_data_admin suite cannot run without it." >&2
            exit 1
          fi
          # A REAL NAME IN THE FIXTURE IS A LEAK, so refuse rather than seed one. `.invalid`
          # is reserved by RFC 2606 and can never be a real domain.
          if grep -nPi "@(?!fixture\.invalid\b)[A-Za-z0-9.-]+\.[A-Za-z]{2,}" "$SEED"; then
            echo "::error::$SEED contains an email address outside fixture.invalid. Fixture data must be synthetic." >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 --no-psqlrc -f "$SEED" 2>&1 | tee "$RUNNER_TEMP/fixture-seed.log"

      - name: Run every supabase/tests/*.sql
        id: run
        env:
          # The local stack's fixed superuser connection. This is the Supabase CLI's
          # documented default for a throwaway local database; it is not a secret and
          # it reaches nothing outside this runner.
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -uo pipefail
          shopt -s nullglob
          FILES=(supabase/tests/*.sql)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No supabase/tests/*.sql found -- the glob or the checkout is wrong." >&2
            exit 1
          fi

          QUARANTINE_FILE=supabase/tests/ci-quarantine.txt
          is_quarantined() {
            [ -f "$QUARANTINE_FILE" ] || return 1
            grep -vE '^\s*(#|$)' "$QUARANTINE_FILE" | awk '{print $1}' | grep -qxF "$1"
          }

          # A QUARANTINE ENTRY IS ITSELF A THING THAT CAN ROT SILENTLY. If a test file is
          # renamed or deleted, its line here keeps matching nothing forever and nobody is
          # told. That is the same defect as an un-run test: present, green, enforcing
          # nothing. So a line naming a file that does not exist FAILS the job.
          if [ -f "$QUARANTINE_FILE" ]; then
            STALE=()
            while read -r name; do
              [ -n "$name" ] || continue
              [ -f "supabase/tests/$name" ] || STALE+=("$name")
            done < <(grep -vE '^\s*(#|$)' "$QUARANTINE_FILE" | awk '{print $1}')
            if [ "${#STALE[@]}" -gt 0 ]; then
              printf '::error::quarantine names a file that does not exist: %s\n' "${STALE[@]}" >&2
              echo "::error::$QUARANTINE_FILE is stale. Remove the dead line(s) -- a quarantine entry that matches nothing hides nothing and proves nothing." >&2
              exit 1
            fi
          fi

          mkdir -p "$RUNNER_TEMP/results"
          PASS=0; FAIL=0; QUAR_PASS=0; QUAR_FAIL=0
          FAILED_FILES=()
          QUAR_FAILED_FILES=()
          QUAR_PASSED_FILES=()

          echo "Executing ${#FILES[@]} contract test files."
          echo ""

          for f in "${FILES[@]}"; do
            base="$(basename "$f")"
            log="$RUNNER_TEMP/results/$base.log"
            run_file="$f"
            if [ "$base" != "licensing_write_authority_guard_contracts.sql" ] && \
               [ "$base" != "clickup_task_import_contracts.sql" ] && \
               [ "$base" != "coldlion_promotion_serialization_lock.sql" ]; then
              run_file="$RUNNER_TEMP/results/$base.wrapper.sql"
              case "$base" in
                popsg_property_resolution_contracts.sql|popdam_effective_asset_filter_contracts.sql|opa_property_character_landing_contracts.sql|opa_property_character_importer_contracts.sql|opa_normalized_sync_contracts.sql|item_taxonomy_phase2_fixture.sql|contract_property_evidence_contracts.sql|coldlion_licensor_property_phase4_contracts.sql|coldlion_licensor_property_phase2_contracts.sql|coldlion_licensor_property_phase1_contracts.sql|source_resolution_durability_contracts.sql|source_resolution_remaining_sources_contracts.sql|db_data_admin_licensor_property_tree.sql|wb_canonical_relationship_edges_contracts.sql)
                  printf 'begin;\nselect public.ci_authorize_licensing_contract_test();\n\\ir %s\nrollback;\n' "$GITHUB_WORKSPACE/$f" > "$run_file"
                  ;;
                *)
                  printf 'begin;\n\\ir %s\nrollback;\n' "$GITHUB_WORKSPACE/$f" > "$run_file"
                  ;;
              esac
            fi
            echo "::group::$base"
            if psql -v ON_ERROR_STOP=1 --no-psqlrc -f "$run_file" > "$log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            cat "$log"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              if is_quarantined "$base"; then
                # It passes but is still quarantined, so its result is being ignored.
                # Say so loudly: the line should come out.
                QUAR_PASS=$((QUAR_PASS+1)); QUAR_PASSED_FILES+=("$base")
                echo "::warning::$base is quarantined but PASSED -- remove it from $QUARANTINE_FILE so its result counts."
              else
                PASS=$((PASS+1)); echo "PASS $base"
              fi
            else
              if is_quarantined "$base"; then
                QUAR_FAIL=$((QUAR_FAIL+1)); QUAR_FAILED_FILES+=("$base")
                echo "::warning::FAIL (quarantined, not failing the job) $base"
              else
                FAIL=$((FAIL+1)); FAILED_FILES+=("$base")
                echo "::error::FAIL $base"
              fi
            fi
          done

          {
            echo "## supabase/tests contract results"
            echo ""
            echo "Ran against a from-empty ephemeral database with every supabase/migrations file applied."
            echo ""
            echo "| outcome | count |"
            echo "| --- | ---: |"
            echo "| files executed | ${#FILES[@]} |"
            echo "| passed | $PASS |"
            echo "| FAILED | $FAIL |"
            echo "| quarantined, passed anyway | $QUAR_PASS |"
            echo "| quarantined, failed | $QUAR_FAIL |"
            echo ""
            if [ "${#FAILED_FILES[@]}" -gt 0 ]; then
              echo "### Failures"
              printf '  - %s\n' "${FAILED_FILES[@]}"
              echo ""
            fi
            if [ "${#QUAR_PASSED_FILES[@]}" -gt 0 ]; then
              echo "### Quarantined but passing -- take these off the list"
              printf '  - %s\n' "${QUAR_PASSED_FILES[@]}"
              echo ""
            fi
            if [ -f "$QUARANTINE_FILE" ]; then
              echo "### Quarantine list (printed every run so it cannot grow quietly)"
              echo ""
              echo '```'
              cat "$QUARANTINE_FILE"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL non-quarantined contract test file(s) failed." >&2
            exit 1
          fi

      - name: Prove source-resolution concurrent first-writer conflict
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/source_resolution_first_writer_race.sh

      - name: Prove Flow 4 concurrent replay serialization
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash supabase/tests/sample_tracking_flow4_remote_requests_concurrency.sh

      - name: Upload every test's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-contract-test-logs
          path: |
            ${{ runner.temp }}/db-start.log
            ${{ runner.temp }}/failed-migrations.txt
            ${{ runner.temp }}/failed-migrations-pass2.txt
            ${{ runner.temp }}/migration-logs/
            ${{ runner.temp }}/migration-logs-pass2/
            ${{ runner.temp }}/baseline.log
            ${{ runner.temp }}/fixture-seed.log
            ${{ runner.temp }}/ledger-init.log
            ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop the ephemeral database
        if: always()
        run: supabase stop --no-backup || true
