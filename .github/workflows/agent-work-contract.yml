# Guard: does an agent's completion report actually satisfy the contract it was
# given? (Step 4, issue #1366)
#
# NO `paths:` FILTER, ON PURPOSE (AGENTS.md 5.2). This is a repository-wide check.
# A path filter would leave the context permanently pending on any pull request
# that did not touch the filtered files, and GitHub can then reuse a stale verdict
# for a repository-wide required check. That failure mode is recorded in issue
# #1286 and in AGENTS.md 5.2; do not "optimise" it back in.
#
# REPORT-ONLY IS NOT "IGNORE ERRORS". While
# config/agent-work-contract-activation.json says mode=report-only, a pull request
# with NO contract passes. A pull request WITH a malformed contract or a report
# that contradicts its contract FAILS either way — shipping a broken guard in a
# quiet mode is how a guard gets trusted without ever having worked.
name: Agent work contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Read-only, and only so the documents-only exemption (#2591) can ask GitHub
  # for the pull request's changed-file list. The gate must judge the PULL
  # REQUEST against its base, not whatever the runner has on disk.
  pull-requests: read

concurrency:
  group: agent-work-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Agent work contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The offline unit tests come first. A guard whose own logic is broken must
      # never render a verdict on somebody else's pull request.
      - name: Prove the contract logic itself
        run: >-
          node --test
          scripts/agent-work-contract.test.mjs
          scripts/agent-work-contract-activation.test.mjs
          scripts/agent-work-contract-git-evidence.test.mjs
          scripts/check-documents-only-pull-request.test.mjs

      - name: Report the activation mode, so nobody has to guess
        run: |
          set -euo pipefail
          MODE=$(node scripts/agent-work-contract-activation.mjs --mode --config-file config/agent-work-contract-activation.json)
          echo "mode=$MODE" >> "$GITHUB_ENV"
          {
            echo "## Agent work contract — $MODE"
            echo
            if [ "$MODE" = "report-only" ]; then
              echo "A pull request with no contract passes. A malformed contract or a"
              echo "report that contradicts its contract still FAILS."
            else
              echo "Enforced. Every non-grandfathered pull request must carry a valid"
              echo "contract and a report that satisfies it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate any contract and report carried by this pull request
        env:
          MODE: ${{ env.mode }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Convention: a PR that declares a contract changes both evidence
          # files under .agent/. The activation PR's pair remains on main, so
          # mere filesystem presence is not current-PR evidence. Compare the
          # exact PR base and head before reading either file.
          CONTRACT=.agent/contract.json
          REPORT=.agent/completion.json

          if [ -n "$PR_NUMBER" ]; then
            PAIR_STATE=$(node scripts/agent-work-contract-git-evidence.mjs \
              --classify-evidence-pair \
              --pr-base-sha "$PR_BASE_SHA" \
              --pr-head-sha "$PR_HEAD_SHA")
          else
            # A manual dispatch has no PR diff. Validate the checked-out pair as
            # repository evidence, but do not render a PR gate verdict.
            PAIR_STATE=current
          fi

          case "$PAIR_STATE" in
            inherited|current) ;;
            partial)
              echo "::error::A pull request must change both $CONTRACT and $REPORT together."
              exit 1
              ;;
            *)
              echo "::error::Evidence classification returned an unknown state: $PAIR_STATE"
              exit 1
              ;;
          esac

          if [ "$PAIR_STATE" = "inherited" ] || { [ ! -f "$CONTRACT" ] && [ ! -f "$REPORT" ]; }; then
            if [ "$MODE" = "report-only" ]; then
              echo "No current contract on this pull request; report-only mode allows it."
              exit 0
            fi
            if node scripts/agent-work-contract-activation.mjs --is-grandfathered --config-file config/agent-work-contract-activation.json --pr "$PR_NUMBER" --head-sha "$PR_HEAD_SHA"; then
              exit 0
            fi
            # THE DOCUMENTS-ONLY EXEMPTION (issue #2591, owner approved 2026-09-08).
            #
            # The reviewer draw already exempts a prose-only pull request from the
            # small external database-reviewer pool (#2102). This gate did not know
            # that rule, so it demanded the evidence pair from a pull request that
            # changes nothing but documents -- and adding the pair then CANCELLED
            # the reviewer exemption, because `.json` is not a document extension.
            # A prose-only change could satisfy either gate but never both, so every
            # handoff paid a full two-reviewer round. Both gates now ask the same
            # classifier the same question.
            #
            # RULEBOOK FILES ARE NOT DOCUMENTS. AGENTS.md, CLAUDE.md, skills and
            # plan_*.md keep the full treatment: a bad edit to one of them is as
            # dangerous as a bad migration, because every later session obeys it.
            #
            # FAIL CLOSED. An unreadable or empty file list is never documents-only,
            # and a failed API read leaves the list empty, so it refuses. Every other
            # automated check and the guarded merge lane are unchanged by this.
            if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --slurp                  > /tmp/pr-files.json 2>/tmp/pr-files.err                && node scripts/check-documents-only-pull-request.mjs < /tmp/pr-files.json; then
              echo "This pull request changes only prose documents, so the agent work contract pair is not required (#2591)."
              exit 0
            fi
            echo "::error::Enforced mode requires this pull request to change both $CONTRACT and $REPORT. Inherited main evidence does not count. A documents-only pull request is exempt; this one is not."
            exit 1
          fi

          # HALF A PAIR IS ALWAYS AN ERROR, in either mode. A report with no
          # contract cannot be checked against anything, and a contract with no
          # report is work that never proved itself.
          if [ ! -f "$CONTRACT" ]; then echo "::error::$REPORT exists but $CONTRACT does not; a report with no contract cannot be checked."; exit 1; fi
          if [ ! -f "$REPORT" ]; then echo "::error::$CONTRACT exists but $REPORT does not; the work never reported against its contract."; exit 1; fi

          node scripts/agent-work-contract.mjs --validate-contract --contract-file "$CONTRACT"
          PR_ARGS=()
          if [ -n "$PR_NUMBER" ]; then
            PR_ARGS+=(--expected-pr "$PR_NUMBER" --expected-head-sha "$PR_HEAD_SHA")
          fi
          node scripts/agent-work-contract.mjs --validate-completion --report-file "$REPORT" --contract-file "$CONTRACT" "${PR_ARGS[@]}"
          if [ -n "$PR_NUMBER" ]; then
            node scripts/agent-work-contract-git-evidence.mjs --contract-file "$CONTRACT" --report-file "$REPORT" --pr-base-sha "$PR_BASE_SHA" --pr-head-sha "$PR_HEAD_SHA"
          fi
