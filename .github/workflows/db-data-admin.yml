name: DB Data Admin

on:
  pull_request:
    paths:
      - "apps/db-data-admin/**"
      - "AGENTS.md"
      - "DB_Data_Admin.md"
      - "README.md"
      - "docs/db-data-admin-domain-ownership.md"
      - "scripts/check-domain-ownership.mjs"
      - ".github/workflows/db-data-admin.yml"
  push:
    branches: [main]
    paths:
      - "apps/db-data-admin/**"
      - "AGENTS.md"
      - "DB_Data_Admin.md"
      - "README.md"
      - "docs/db-data-admin-domain-ownership.md"
      - "scripts/check-domain-ownership.mjs"
      - ".github/workflows/db-data-admin.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: db-data-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/db-data-admin
    steps:
      - uses: actions/checkout@v4
      - name: Enforce DB Data Admin domain ownership
        working-directory: .
        run: |
          node --test scripts/check-domain-ownership.test.mjs
          node scripts/check-domain-ownership.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/db-data-admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: VITE_BUILD_DATE="$(date -u +%Y-%m-%d)" npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: VITE_BUILD_DATE="$(date -u +%Y-%m-%d)" npm run test:browser
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/u2giants/db-data-admin
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: apps/db-data-admin
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_BUILD_DATE=${{ steps.build-date.outputs.date }}

  deploy-development:
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Point Coolify at the verified immutable image
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\":\"${image_tag}\"}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}"

      - name: Deploy through Coolify
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"

  # ---------------------------------------------------------------------------
  # Production release for https://data.designflow.app (issue #729).
  #
  # This job is deliberately INERT until two independent things are true, so that
  # merging this workflow can never surprise anyone by publishing an admin tool
  # that reads and writes the database four live applications share:
  #
  #   1. The repository variable COOLIFY_PROD_APP_UUID must be set. It is empty
  #      until the production Coolify application actually exists. An empty value
  #      FAILS the job loudly and visibly; it never falls through to a default or a
  #      guessed target, and it is never a silent no-op.
  #   2. The job runs in the GitHub environment `production`, whose required
  #      reviewer is the owner. Every production release therefore waits for an
  #      explicit human approval in the Actions UI.
  #
  # There is NO fallback path. If either gate is missing the job does not run and
  # says so; it must never quietly deploy somewhere else. Rollback is the same
  # mechanism with an earlier immutable tag, described in
  # docs/db-data-admin-deployment.md.
  # ---------------------------------------------------------------------------
  deploy-production:
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://data.designflow.app
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_PROD_APP_UUID: ${{ vars.COOLIFY_PROD_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Refuse to deploy without an explicit production target
        run: |
          if [ -z "${COOLIFY_PROD_APP_UUID}" ]; then
            echo "::error::COOLIFY_PROD_APP_UUID is not set. The production Coolify"
            echo "::error::application for data.designflow.app does not exist yet, or the"
            echo "::error::repository variable was never filled in. Refusing to deploy."
            exit 1
          fi

      - name: Point Coolify at the verified immutable image
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\":\"${image_tag}\"}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_PROD_APP_UUID}"

      - name: Deploy through Coolify
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_PROD_APP_UUID}&force=false"

      - name: Verify the live production build reports this commit
        run: |
          for attempt in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' https://data.designflow.app/health || true)"
            live="$(curl --silent https://data.designflow.app/ | grep -o 'name="build-sha" content="[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)"
            if [ "${code}" = "200" ] && [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "data.designflow.app is healthy and serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt ${attempt}: health=${code} build-sha=${live:-none}"
            sleep 10
          done
          echo "::error::data.designflow.app did not report health 200 and build-sha ${GITHUB_SHA}."
          echo "::error::Roll back in Coolify to the previous sha-<commit> image."
          exit 1
