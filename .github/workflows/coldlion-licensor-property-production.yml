# ColdLion Licensor/Property RECURRING PRODUCTION feed (accelerated plan Step 7A item 1).
#
# THIS IS NOT A RELAXED COPY OF THE PREVIEW WORKFLOW.
# ---------------------------------------------------
# .github/workflows/coldlion-licensor-property-phase6-parallel.yml is preview-only and
# HARD-REFUSES production. This workflow is its mirror image: it hard-refuses PREVIEW and
# every other project ref, and it is the only lane allowed to name qsllyeztdwjgirsysgai.
# Neither file may ever be edited into the other. Two opposite guards are auditable; one
# guard with an environment switch is not — a single wrong variable would silently retarget
# a write lane, which is exactly the failure this pair of workflows exists to prevent.
#
# WHY IT EXISTS
# -------------
# Steps 1-7 of plan_coldlion_licensor_property_accelerated_cutover.md built a safe ONE-TIME
# mirror + 542-link package. GLM-5.2 found on 2026-07-28 that a one-time link is not the
# routine feed switch the plan's §1 goal states. Albert chose the real recurring feed on
# 2026-07-29. This workflow IS that recurring lane. A one-time 542-link run does NOT
# complete the feed switch.
#
# DISABLED BY DEFAULT — AND IT STAYS DISABLED UNTIL STEP 8.
# ---------------------------------------------------------
# Every path in this file is gated on repository variable
#   COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED=true
# which does not exist yet and must NOT be created before Albert's Step 8 approval names
# the exact project, migrations, modes, schedules, secrets, window, and rollback. While the
# variable is absent or not exactly "true" this workflow SKIPS LOUDLY (a ::warning:: on
# every trigger) and stops. It NEVER falls back to preview, NEVER downgrades a write job to
# a dry run, and NEVER "does something harmless instead" — a silent degradation would let an
# operator believe the production feed is running when it is not.
#
# REQUIRED GitHub Actions secrets — NAMES ONLY. No value appears in this file, in any log,
# or in any command line. Values live in 1Password vault vibe_coding.
#   SUPABASE_ACCESS_TOKEN          — Supabase CLI Personal Access Token
#   SUPABASE_DB_PASSWORD_PRODUCTION — production DB password
#                                     (1Password: "Supabase DB Password - shared POP database").
#                                     Creating this secret is itself a named production action
#                                     that requires Step 8 approval.
#   COLDLION_API_KEY               — Coldlion ERP API key x5.coldlion.com
#
# REQUIRED repository variable:
#   COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED=true   (absent today, by design)
#
# Scheduled sequence (exact cron strings are the ONLY lane selector — see
# tools/coldlion-production-schedule-map.mjs; never wall-clock time):
#   0 6 * * *   coldlion  full ColdLion snapshot (mirror_only)
#   30 6 * * *  promote   approved source-owned promotion
#   0 7 * * *   compare   ColdLion vs DesignFlow comparison
#   45 * * * *  health    hourly health
# `readiness` is deliberately dispatch-only: it is an operator gate, not a cron job.
#
# Human response owner for every failure: Albert Hazan.

name: ColdLion Licensor/Property Recurring Feed (PRODUCTION)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which production lane to run"
        type: choice
        required: true
        default: readiness
        options:
          - coldlion
          - promote
          - compare
          - health
          - readiness
          # ARMED BUT READ-ONLY (issue #548). Runs with the production feed still
          # DISABLED and proves exactly what every lane WOULD do, without doing it.
          - preflight
      confirm_production:
        description: "Type the production project ref to confirm: qsllyeztdwjgirsysgai"
        type: string
        required: true
        default: ""
  schedule:
    - cron: "0 6 * * *" # coldlion — retired gate emits warning only
    - cron: "30 6 * * *" # promote — retired gate emits warning only
    - cron: "0 7 * * *" # compare — retired gate emits warning only
    - cron: "45 * * * *" # health — retired gate emits warning only

permissions:
  contents: read
  issues: write # so the DETECTING run delivers its own alert immediately

# ONE non-cancelling group for the whole workflow. Snapshot, promotion, comparison and
# health can never overlap, and a queued run is never cancelled — cancel-in-progress on a
# write lane would abandon a half-finished promotion window.
concurrency:
  group: coldlion-licensor-property-production
  cancel-in-progress: false

env:
  PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
  # CONFIGURED, not hard-coded: the preview project ref changes whenever the preview
  # branch is rebuilt (rjyboqwcdzcocqgmsyel was deleted on 2026-08-18). An unset
  # repository variable is REFUSED below, never defaulted. See AGENTS.md rule 2.
  PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
  PHASE6_MAX_SUCCESS_AGE: "36 hours"
  COLDLION_HUMAN_RESPONSE_OWNER: Albert Hazan

jobs:
  # ---------------------------------------------------------------------------------
  # GATE — runs with NO production environment and NO production secret. Its only jobs
  # are to decide whether the lane is enabled, resolve the lane deterministically, and
  # prove the offline contracts. Nothing production-facing happens here.
  # ---------------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    outputs:
      enabled: ${{ steps.enabled.outputs.enabled }}
      job: ${{ steps.plan.outputs.job }}
      writes: ${{ steps.plan.outputs.writes }}
    steps:
      - name: Refuse retired canonical promotion lane
        id: retired
        run: |
          echo "::warning::Retired by shared-db issue #1090 Step 1.0. This workflow cannot write canonical licensing data until the governed Step 4 replacement lands."
      - uses: actions/checkout@v4

      - name: Refuse any ref that is not production
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_PROJECT_REF}" != "qsllyeztdwjgirsysgai" ]; then
            echo "::error::Hard-coded production ref mismatch: ${PRODUCTION_PROJECT_REF}" >&2
            exit 1
          fi
          if [ -z "${PREVIEW_PROJECT_REF// /}" ]; then
            echo "::error::REFUSED: repository variable PREVIEW_PROJECT_REF is not set, so this lane cannot prove it is not linked to preview. An unset ref is never treated as a default." >&2
            exit 1
          fi
          if ! printf '%s' "${PREVIEW_PROJECT_REF}" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::REFUSED: PREVIEW_PROJECT_REF is not a 20-character Supabase project ref." >&2
            exit 1
          fi
          if [ "${PRODUCTION_PROJECT_REF}" = "${PREVIEW_PROJECT_REF}" ]; then
            echo "::error::PRODUCTION and PREVIEW refs must differ" >&2
            exit 1
          fi
          echo "This workflow targets ONLY ${PRODUCTION_PROJECT_REF}."

      - name: Refuse a workflow_dispatch that does not spell out the production ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          GIVEN='${{ inputs.confirm_production }}'
          if [ "$GIVEN" != "${PRODUCTION_PROJECT_REF}" ]; then
            echo "::error::confirm_production must be exactly ${PRODUCTION_PROJECT_REF} (got '${GIVEN}'). Refusing a production run that was not explicitly confirmed." >&2
            exit 1
          fi

      - name: Enable gate (SKIPS LOUDLY while disabled; never falls back to preview)
        id: enabled
        run: |
          set -euo pipefail
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "SKIPPED LOUDLY: retired by #1090 Step 1.0. No database call ran."
          exit 0
          if [ "${{ vars.COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Production recurring lane is ENABLED for ${PRODUCTION_PROJECT_REF}."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ColdLion production feed is DISABLED::COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED is not 'true', so this ${{ github.event_name }} trigger performed NO work against ${PRODUCTION_PROJECT_REF}. This is the intended pre-Step-8 state. There is deliberately NO preview fallback and NO dry-run fallback: nothing ran. Enabling this variable is a named production action that requires Albert Hazan's Step 8 approval naming the exact project, migrations, modes, schedules, secrets, window and rollback."
            echo "SKIPPED LOUDLY: disabled. No preview fallback. No dry-run fallback. Nothing ran."
          fi

      - name: Resolve the lane from the exact cron string (never wall-clock time)
        id: plan
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          else
            # Keep in lockstep with tools/coldlion-production-schedule-map.mjs. A delayed
            # runner still resolves the lane it was scheduled for, because the decision
            # comes from github.event.schedule and nothing else.
            SCHEDULE='${{ github.event.schedule }}'
            case "$SCHEDULE" in
              "0 6 * * *") JOB=coldlion ;;
              "30 6 * * *") JOB=promote ;;
              "0 7 * * *") JOB=compare ;;
              "45 * * * *") JOB=health ;;
              *)
                echo "::error::Unknown github.event.schedule expression for the production lane: [$SCHEDULE]" >&2
                exit 1
                ;;
            esac
          fi
          case "$JOB" in
            coldlion|promote) WRITES=true ;;
            compare|health|readiness) WRITES=true ;;
            # preflight is the ONLY lane that writes nothing: it runs in its own job,
            # never in the `production` job, and never touches a database. See #548.
            preflight) WRITES=false ;;
            *) echo "::error::Unknown production job: $JOB" >&2; exit 1 ;;
          esac
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "writes=$WRITES" >> "$GITHUB_OUTPUT"
          echo "Resolved production job=$JOB (schedule='${{ github.event.schedule }}')"

      - uses: actions/setup-node@v4
        if: steps.enabled.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Offline contract tests (must pass before any production write)
        if: steps.enabled.outputs.enabled == 'true'
        run: |
          node --test \
            tools/phase6-preview-guards.test.mjs \
            tools/phase6-schedule-map.test.mjs \
            tools/coldlion-production-schedule-map.test.mjs \
            tools/coldlion-production-authorization.test.mjs \
            tools/coldlion-recurring-promotion.test.mjs \
            tools/coldlion-promotion-failure-recording.test.mjs \
            tools/promote-coldlion-source-owned.test.mjs \
            tools/coldlion-licensor-property-production-workflow.test.mjs \
            tools/phase6-cli-result-parse.test.mjs \
            tools/evaluate-coldlion-licensor-property-cutover-readiness.test.mjs

  # ---------------------------------------------------------------------------------
  # PRODUCTION — the only job with the `production` environment and the production DB
  # password. It cannot start unless the gate says the lane is enabled.
  # ---------------------------------------------------------------------------------
  production:
    needs: gate
    # `preflight` is excluded here on purpose: it must NEVER enter the job that holds
    # the production environment and the production DB password (#548).
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.job != 'preflight'
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 90
    environment: production
    env:
      # The four-part production authorization. Part 4 is this variable; parts 1-3 are the
      # flags spelled out on every runner invocation below. All four, every time.
      COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED: "true"
      LANE: ${{ needs.gate.outputs.job }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify every required secret NAME is wired (values never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD_PRODUCTION: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
          COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_DB_PASSWORD_PRODUCTION:-}" ] || MISSING="$MISSING SUPABASE_DB_PASSWORD_PRODUCTION"
          [ -n "${COLDLION_API_KEY:-}" ] || MISSING="$MISSING COLDLION_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing production secret::Refusing the production lane; missing secret(s):$MISSING. This fails LOUDLY rather than degrading to preview or a dry run. Human response owner: ${COLDLION_HUMAN_RESPONSE_OWNER}." >&2
            exit 1
          fi
          echo "All three required secret names are populated."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the production project only, and prove it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          set -euo pipefail
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          LINKED=$(cat supabase/.temp/project-ref)
          echo "Linked project: $LINKED"
          if [ "$LINKED" = "$PREVIEW_PROJECT_REF" ]; then
            echo "::error::Refusing: the production workflow linked PREVIEW ${PREVIEW_PROJECT_REF}." >&2
            exit 1
          fi
          if [ "$LINKED" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Refusing: linked project $LINKED is not production ${PRODUCTION_PROJECT_REF}." >&2
            exit 1
          fi

      # Defence in depth over the check above, which reads ONE of the three files in
      # supabase/.temp/ that can each name a project.
      #
      # Measured 2026-08-07 on a developer checkout: supabase/.temp/project-ref said
      # PREVIEW while supabase/.temp/linked-project.json in the same directory said
      # PRODUCTION. Direct measurement (see tools/check-supabase-link-state.mjs) showed
      # the CLI follows project-ref, so the check above was right about the CLI -- but a
      # DIFFERENT tool reading linked-project.json (the Supabase MCP / editor extension)
      # would have acted on the other project entirely. `supabase link` never writes or
      # refreshes that JSON file, so no re-link can correct it -- isolated by a
      # before/after experiment in
      # docs/verification/opa-preview-load-20260807/evidence/11-what-supabase-link-writes.txt
      # (a planted linked-project.json survived a `supabase link` byte-for-byte).
      #
      # This step asserts all three files agree AND name production. It is offline, needs
      # no secret, and cannot itself reach a database.
      - name: Prove ALL Supabase link files agree on production
        run: node tools/check-supabase-link-state.mjs --expect-ref="$PRODUCTION_PROJECT_REF"

      # Every write runner below carries ALL FOUR authorization parts:
      #   --production  --production-authorized  --project-ref qsllyeztdwjgirsysgai
      #   + COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED=true (job env)
      # and --apply --linked against the project proven above. There is no dry-run
      # variant of these steps: a production lane that quietly dry-runs is a lie.

      - name: coldlion — daily full ColdLion snapshot (mirror_only)
        if: env.LANE == 'coldlion'
        env:
          COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
        run: |
          set -euo pipefail
          node tools/sync-coldlion-licensors-properties.mjs \
            --apply --linked \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: promote — approved source-owned promotion (guarded, audited)
        if: env.LANE == 'promote'
        env:
          COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
        run: |
          set -uo pipefail
          # NOT `set -e` here, on purpose: this runner has THREE meaningful outcomes, and
          # `set -e` would collapse two of them into "the job failed".
          #   0 = promoted (or a clean no-op)
          #   3 = SKIPPED — another promotion already held advisory lock 720260729, so this
          #       cycle read and wrote nothing. That is a normal overlap between the
          #       schedule and a manual drill. Failing the job here would page a human for
          #       a healthy race, and a red scheduled run is exactly the noise that gets
          #       alerting muted. The skip is already durably recorded as a CANCELLED
          #       ingest.sync_run row, so it is visible without a red check.
          #   anything else = a real refusal/failure, which must still fail the job.
          node tools/promote-coldlion-source-owned.mjs \
            --apply --linked \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"
          promote_status=$?
          if [ "$promote_status" -eq 3 ]; then
            echo "::notice::ColdLion promotion SKIPPED — another promotion already holds advisory lock 720260729. Nothing was read or written; the next scheduled cycle promotes whatever this one deferred."
            exit 0
          fi
          exit "$promote_status"

      - name: compare — ColdLion vs DesignFlow daily comparison
        if: env.LANE == 'compare'
        run: |
          set -euo pipefail
          node tools/compare-coldlion-designflow-daily.mjs \
            --apply --linked \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: health — hourly health check
        if: env.LANE == 'health'
        run: |
          set -euo pipefail
          node tools/check-coldlion-designflow-sync-health.mjs \
            --apply --linked \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: readiness — operator gate (dispatch only)
        if: env.LANE == 'readiness'
        run: |
          set -euo pipefail
          node tools/evaluate-coldlion-licensor-property-cutover-readiness.mjs \
            --apply --linked \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      # The detecting run delivers its own alert. Waiting for the */10 alert-monitor cron
      # was the wrong design: GitHub throttled it to 57-201 minute gaps on 2026-07-27/28.
      # This run is already awake and already knows, so it files the issue in seconds.
      # If alert delivery itself fails, the step fails and the workflow stays RED.
      - name: Deliver the production alert immediately on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COLDLION_ALERT_ISSUE_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e
          node tools/dispatch-coldlion-taxonomy-alerts.mjs --apply --linked \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF" --out alert-plan.json
          CODE=$?
          set -e
          # #551 dedupe. Exit 3 means this exact alert set is ALREADY on an open issue,
          # so filing another one only buries it. The run is already RED (this step only
          # runs on failure()), so the loud signal is not lost.
          if [ "$CODE" -eq 3 ]; then
            MATCH=$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('alert-plan.json','utf8')).dedupe_matched_issue??'unknown'))}catch(e){process.stdout.write('unknown')}")
            echo "::error::ColdLion PRODUCTION alert is ALREADY REPORTED on open issue #${MATCH}; no duplicate filed. The run stays RED. Human response owner: ${COLDLION_HUMAN_RESPONSE_OWNER}."
            exit 0
          fi
          if [ "$CODE" -eq 4 ]; then
            echo "::error title=ColdLion alert DEDUPE CHECK FAILED::The duplicate check could not be completed. Filing the alert anyway — a possible duplicate is strictly better than a swallowed production alert. Human response owner: ${COLDLION_HUMAN_RESPONSE_OWNER}."
          fi
          if { [ "$CODE" -eq 1 ] || [ "$CODE" -eq 4 ]; } && [ -f alert-plan.json ]; then
            TITLE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('alert-plan.json','utf8')).title)")
            node -e "require('fs').writeFileSync('alert-body.md', JSON.parse(require('fs').readFileSync('alert-plan.json','utf8')).body)"
          else
            TITLE="ColdLion PRODUCTION licensor/property lane FAILED (${LANE}) - run ${{ github.run_id }}"
            printf '%s\n' \
              "The ColdLion **production** recurring lane failed and no durable alert row was readable (dispatcher exit ${CODE})." \
              "" \
              "* Environment: PRODUCTION \`${PRODUCTION_PROJECT_REF}\`" \
              "* Lane: \`${LANE}\`" \
              "* Human response owner: **${COLDLION_HUMAN_RESPONSE_OWNER}**" \
              "" \
              "First response: set repository variable \`COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED\` to \`false\` to stop the recurring lane, leave mirrors and evidence intact, compare the protected UUID/status/parent hashes, then reproduce and fix forward on preview via shared-db." \
              > alert-body.md
          fi
          {
            echo ""
            echo "Delivered immediately by the detecting run ${{ github.run_id }} (lane: ${LANE}) at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> alert-body.md
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file alert-body.md \
            --label "coldlion-taxonomy-alert" \
            || gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file alert-body.md
          echo "::error::ColdLion PRODUCTION alert delivered. Human response owner: ${COLDLION_HUMAN_RESPONSE_OWNER}."

  # ---------------------------------------------------------------------------------
  # PREFLIGHT — ARMED BUT READ-ONLY (issue #548).
  #
  # THE PROBLEM IT SOLVES
  # ---------------------
  # Every lane above, including the read-only `readiness` operator gate, lives inside
  # the `production` job and is gated on COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED.
  # So setting that one variable SIMULTANEOUSLY arms the 06:00 snapshot, the 06:30
  # promotion (which WRITES to production), the 07:00 comparison and the hourly health
  # lane. The one check an operator wants to run BEFORE committing was only available
  # AFTER committing. That is backwards, and it is the single biggest risk in Step 8.
  #
  # WHAT THIS JOB IS
  # ----------------
  # A separate, second-variable state that proves EXACTLY what the production feed
  # WOULD do, without doing any of it. It is armed in the sense that it carries the
  # full four-part production authorization and resolves the real production target;
  # it is read-only in the sense that it can reach no database at all.
  #
  # HOW "READ-ONLY" IS GUARANTEED — three independent reasons, not one:
  #   1. It is a DIFFERENT JOB. It has no `environment: production` and no
  #      SUPABASE_DB_PASSWORD_PRODUCTION, so it holds no production credential.
  #   2. No step runs `supabase link`, so no runner has a session to write through.
  #   3. Every runner is invoked WITHOUT --apply and WITHOUT --linked. Every ColdLion
  #      runner's own guard already short-circuits there
  #      (assertColdlionApplyTarget: "if (!apply) return; // dry runs never write
  #      anywhere"), and each one prints the SQL and configuration it would use.
  #   The step "Prove this job cannot write" re-asserts 1 and 3 at runtime, and
  #   tools/coldlion-licensor-property-production-workflow.test.mjs asserts them
  #   statically before any run.
  #
  # IT IS ITS OWN SWITCH. It is gated on COLDLION_LICENSOR_PROPERTY_PRODUCTION_ARMED_READONLY,
  # NOT on the feed's enable variable, so it can be exercised while the feed stays off —
  # which is the entire point. It is dispatch-only and is deliberately absent from every
  # cron above: nothing schedules it, so it can never become a background job.
  #
  # ENABLING THIS VARIABLE DOES NOT ENABLE THE FEED. Turning the feed on remains a
  # separate, named, owner-approved Step 8 action against
  # COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED.
  # ---------------------------------------------------------------------------------
  preflight:
    needs: gate
    # Dispatch-only, and independent of the feed's enable variable BY DESIGN. `gate`
    # has already refused any ref that is not production and any dispatch that did not
    # spell the production ref out.
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'preflight'
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    env:
      # Part 4 of the four-part authorization. Here it authorizes only the RESOLUTION of
      # the production target; with no --apply and no --linked there is nothing to write
      # to and no credential to write with.
      COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED: "true"
      ARMED_READONLY_VARIABLE: COLDLION_LICENSOR_PROPERTY_PRODUCTION_ARMED_READONLY
    steps:
      - uses: actions/checkout@v4

      - name: Arm gate (its OWN variable — never the feed's enable variable)
        id: armed
        run: |
          set -euo pipefail
          if [ "${{ vars.COLDLION_LICENSOR_PROPERTY_PRODUCTION_ARMED_READONLY }}" = "true" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "ARMED, READ-ONLY. Resolving the production plan for ${PRODUCTION_PROJECT_REF} without touching it."
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ColdLion preflight is not armed::Set repository variable COLDLION_LICENSOR_PROPERTY_PRODUCTION_ARMED_READONLY=true to run the read-only preflight. This variable does NOT enable the production feed; the feed stays governed by COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED and Albert Hazan's Step 8 approval. Nothing ran."
          fi

      - uses: actions/setup-node@v4
        if: steps.armed.outputs.armed == 'true'
        with:
          node-version: 22

      - name: Offline contract tests
        if: steps.armed.outputs.armed == 'true'
        run: |
          node --test \
            tools/phase6-preview-guards.test.mjs \
            tools/coldlion-production-schedule-map.test.mjs \
            tools/coldlion-production-authorization.test.mjs \
            tools/coldlion-licensor-property-production-workflow.test.mjs \
            tools/dispatch-coldlion-taxonomy-alerts.test.mjs

      - name: Prove this job cannot write
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_PASSWORD_PRODUCTION:-}" ] || [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::The preflight job must hold NO production database password. Refusing." >&2
            exit 1
          fi
          if [ -f supabase/.temp/project-ref ]; then
            echo "::error::The preflight job must not be linked to any Supabase project. Refusing." >&2
            exit 1
          fi
          echo "No production credential, no linked project. This job cannot reach a database."

      - name: Which secret NAMES would be present when the feed is armed (values never printed)
        if: steps.armed.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -n "${COLDLION_API_KEY:-}" ] || MISSING="$MISSING COLDLION_API_KEY"
          echo "SUPABASE_DB_PASSWORD_PRODUCTION is deliberately NOT readable from this job;"
          echo "it lives only in the 'production' environment. Verify it there before Step 8."
          if [ -n "$MISSING" ]; then
            echo "::warning title=Secret not wired yet::These secret names are still empty and the production feed WILL refuse to start without them:$MISSING"
          else
            echo "Both repository-level secret names are populated."
          fi

      - name: Which lane each cron WOULD resolve to
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          node -e "import('./tools/coldlion-production-schedule-map.mjs').then(m=>{for(const [cron,job] of Object.entries(m.COLDLION_PRODUCTION_SCHEDULE_JOBS)) console.log(cron.padEnd(14), '->', job)})"

      # Each runner below is the EXACT production invocation minus --apply and --linked.
      # It resolves the real production target, then prints the SQL and configuration it
      # would use and stops before every database write. The snapshot runner DOES contact
      # the live ColdLion ERP to build its read-only plan; none of these runners connects
      # to Supabase. If a runner cannot produce its plan, that is a real defect and this
      # job fails loudly rather than reporting a clean preflight.
      - name: coldlion — what the 06:00 snapshot WOULD do
        if: steps.armed.outputs.armed == 'true'
        env:
          # Repository secret only. The preflight needs it for the live ERP read, but it
          # still has no Supabase password, project session, or database write path.
          COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
        run: |
          set -euo pipefail
          node tools/sync-coldlion-licensors-properties.mjs \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: promote — what the 06:30 promotion WOULD do
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          node tools/promote-coldlion-source-owned.mjs \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: compare — what the 07:00 comparison WOULD do
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          node tools/compare-coldlion-designflow-daily.mjs \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: health — what the hourly health lane WOULD do
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          node tools/check-coldlion-designflow-sync-health.mjs \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: readiness — what the operator gate WOULD evaluate
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          node tools/evaluate-coldlion-licensor-property-cutover-readiness.mjs \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: alert — what the failure alert WOULD deliver
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          node tools/dispatch-coldlion-taxonomy-alerts.mjs \
            --production --production-authorized \
            --project-ref "$PRODUCTION_PROJECT_REF"

      - name: Preflight summary
        if: steps.armed.outputs.armed == 'true'
        run: |
          set -euo pipefail
          echo "PREFLIGHT COMPLETE (read-only). Every lane resolved production ${PRODUCTION_PROJECT_REF} and printed its plan."
          echo "NOTHING was written. The production feed is STILL governed by COLDLION_LICENSOR_PROPERTY_PRODUCTION_ENABLED,"
          echo "which this job neither reads as permission nor changes. Human response owner: ${COLDLION_HUMAN_RESPONSE_OWNER}."
