# Guard: is what is MERGED the same as what is APPLIED? (issue #892)
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# On 2026-08-13 six migrations were found merged to `main` and never applied to
# production. Nothing reported it. An orchestrator read the LIVE production
# catalog, saw one Disney landing table where Paramount had twenty, and told the
# business owner Disney's model had never been built. Seventeen Disney tables
# existed as reviewed, merged SQL that had simply never been switched on.
#
#   THE LIVE CATALOG IS NOT PROOF THAT WORK WAS NEVER DONE.
#
# Nothing in this repository compared the two sides. `check-sql.sh` compares
# files to files. The contract tests run against a throwaway database. The
# migrations workflow applies an allowlist and never asks what was left behind.
# This job asks the one question none of them ask, and asks it routinely.
#
# WHY THIS HOME, AND NOT AN EXISTING WORKFLOW
# -------------------------------------------
#   * NOT `database-contract-tests.yml` — that workflow is forbidden by its own
#     first step from holding any secret or naming a shared project ref. This job
#     must read production's ledger, so putting it there would break that job's
#     confinement guarantee, which is worth more than the convenience.
#   * NOT `shared-supabase-migrations.yml` — that is the APPLY lane. A drift
#     report that only runs when somebody applies migrations cannot report the
#     drift caused by nobody applying them. That is the exact defect.
#   * A dedicated workflow, on THREE triggers, mirroring the design of
#     `orchestrator-marker-guard.yml`:
#       - push to `main`, so drift is announced at the moment a merge creates it;
#       - a daily schedule, because the dangerous window is the days when nobody
#         merges and nobody applies;
#       - workflow_dispatch, so a session can ask on demand before concluding
#         anything about a "missing" schema object.
#
# NO `pull_request:` TRIGGER, ON PURPOSE. A pull request that ADDS a migration is
# drift by definition until it is applied, so a PR leg would be red on every
# migration PR and would be trained away within a week.
#
# NO `paths:` FILTER (AGENTS.md 5.2). Drift is created by APPLYING or NOT
# applying, which changes no file at all, so no honest path filter exists.
#
# NO SILENT FAILURES. The script exits 2 and fails this job whenever it could not
# read either side. A run that could not check must never look like a clean one.

name: Migration Ledger Drift

on:
  push:
    branches: [main]
  schedule:
    # Daily, early UTC. Drift lives in the gap between merging and applying, and
    # that gap is measured in days.
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which database's ledger to compare against origin/main"
        type: choice
        required: true
        default: production
        options: [production, preview]

permissions:
  contents: read
  issues: write

concurrency:
  group: migration-ledger-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Migration ledger drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is REQUIRED. The script resolves origin/main to read the
      # merged migration set; on a shallow checkout it exits 2 rather than
      # guessing, which would turn every run into a failure.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A guard whose own tests are not run is a guard nobody has proven fires.
      # These specifically prove it REFUSES to report "no drift" on an empty or
      # unreachable ledger.
      - name: Prove the guard fails loudly on an unreadable ledger
        run: node --test scripts/check-migration-ledger-drift.test.mjs scripts/check-worktree-freshness.test.mjs

      - name: Compare origin/main against the applied ledger
        id: check
        env:
          # Read-only use: the script runs one constant SELECT and has no code
          # path that can issue any other statement.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TARGET: ${{ inputs.target || 'production' }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not available, so the ledger was NOT read. This is not a clean result." >&2
            exit 1
          fi
          set +e
          node scripts/check-migration-ledger-drift.mjs --target "$TARGET" | tee /tmp/drift.txt
          CODE=${PIPESTATUS[0]}
          set -e
          {
            echo "## Migration ledger drift — ${TARGET}"
            echo
            echo '```'
            cat /tmp/drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$CODE" in
            0) echo "No drift." ;;
            1) echo "::error::Migration ledger drift detected against ${TARGET}. See the job summary." ;;
            *) echo "::error::The drift check COULD NOT RUN (exit ${CODE}). Nothing was compared — do not read this as no drift." ;;
          esac
          exit "$CODE"

      # ---------------------------------------------------------------------
      # Alarm path for the SCHEDULED leg only, copied deliberately from
      # orchestrator-marker-guard.yml. A failed scheduled run mails the commit
      # author, and the mandated committer identity is a `noreply` address — so
      # by default NOBODY is told. Throttled to ONE open issue: this repo has
      # already produced 25 duplicates from a monitor with no dedupe.
      # ---------------------------------------------------------------------
      - name: Raise ONE throttled alarm issue (scheduled runs only)
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="MIGRATION LEDGER DRIFT — merged work may not be applied"

          # Enumerate and match client-side, not with a server-side search
          # filter: an eventually-consistent empty answer files a duplicate.
          EXISTING="$(gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.pull_request == null) | select(.title == \"${TITLE}\") | .number] | .[0] // empty")"

          if [ -n "${EXISTING}" ]; then
            echo "Alarm issue #${EXISTING} is already open — not filing another."
            exit 0
          fi

          cat > /tmp/alarm-body.md <<BODY
          The scheduled \`Migration ledger drift\` run failed against **production**.

          Either migrations are **merged to \`main\` and not applied**, or the ledger holds a
          row with **no file on \`main\`**, or the check **could not run at all**.

          **Read the run before drawing any conclusion about the schema:**
          ${RUN_URL}

          ⚠️ **The live catalog is NOT proof that work was never done.** A merged-but-unapplied
          migration is invisible in \`information_schema\` and looks exactly like work nobody
          ever wrote. That mistake was reported to the owner on 2026-08-13 (issue #892).

          Check by hand:

              SUPABASE_ACCESS_TOKEN=... node scripts/check-migration-ledger-drift.mjs --target production

          **Close this issue by hand once resolved.** It is throttled: while it is open, no
          further alarm issues are filed.
          BODY

          gh issue create --repo "${REPO}" --label db-work \
            --title "${TITLE}" --body-file /tmp/alarm-body.md
