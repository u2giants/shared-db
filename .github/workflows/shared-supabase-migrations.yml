        if: inputs.mode == 'apply' && (inputs.historical_preview_source_pr == '' && inputs.historical_preview_source_pr_map == '')
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-preview"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-preview" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
          # A FRESH dry-run immediately before the write, verified against the
          # allowlist, so the run proves what it is about to do rather than
          # inheriting an earlier job's claim.
          ATOMIC_VERSION="$(python "$GITHUB_WORKSPACE/scripts/atomic_migration_apply.py" \
            --migrations-dir "$RUNNER_TEMP/bounded-preview/supabase/migrations" \
            --classify-allowlist "$PREVIEW_ALLOWLIST")"
          if [ -n "$ATOMIC_VERSION" ]; then
            psql --version
            EXPECTED_PROJECT_REF="$PREVIEW_PROJECT_REF" python "$GITHUB_WORKSPACE/scripts/atomic_migration_apply.py" \
              --migrations-dir "$RUNNER_TEMP/bounded-preview/supabase/migrations" \
              --linked-dir "$RUNNER_TEMP/bounded-preview" --version "$ATOMIC_VERSION" \
              --target preview --expected-project-ref "$PREVIEW_PROJECT_REF" --mode check \
              | tee "$RUNNER_TEMP/preview-dry-run.txt"
            EXPECTED_PROJECT_REF="$PREVIEW_PROJECT_REF" python "$GITHUB_WORKSPACE/scripts/atomic_migration_apply.py" \
              --migrations-dir "$RUNNER_TEMP/bounded-preview/supabase/migrations" \
              --linked-dir "$RUNNER_TEMP/bounded-preview" --version "$ATOMIC_VERSION" \
              --target preview --expected-project-ref "$PREVIEW_PROJECT_REF" --mode apply \
