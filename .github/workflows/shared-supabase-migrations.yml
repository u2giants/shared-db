          # production lane, and for one preview-specific reason: 20260810140000
          # sorts BELOW preview's ledger head, so the CLI refuses it without the
          # flag. The bound is the filesystem -- `prepare` left exactly
          # `remote-ledger | allowlist` on disk. NEVER add this flag to a
          # `supabase db push` that runs in $GITHUB_WORKSPACE.
          ATOMIC_VERSION="$(python "$GITHUB_WORKSPACE/scripts/atomic_migration_apply.py" \
            --migrations-dir "$RUNNER_TEMP/bounded-preview/supabase/migrations" \
            --classify-allowlist "$PREVIEW_ALLOWLIST")"
          if [ -n "$ATOMIC_VERSION" ]; then
            psql --version
            EXPECTED_PROJECT_REF="$PREVIEW_PROJECT_REF" python "$GITHUB_WORKSPACE/scripts/atomic_migration_apply.py" \
              --migrations-dir "$RUNNER_TEMP/bounded-preview/supabase/migrations" \
              --linked-dir "$RUNNER_TEMP/bounded-preview" --version "$ATOMIC_VERSION" \
              --target preview --expected-project-ref "$PREVIEW_PROJECT_REF" --mode check \
              | tee "$RUNNER_TEMP/preview-dry-run.txt"
          else
            supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/preview-dry-run.txt"
            # THE RESOLVED SET MUST EQUAL THE NAMED SET, exactly and in order.
            python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
              --dry-run-output "$RUNNER_TEMP/preview-dry-run.txt" \
              --allowlist "$PREVIEW_ALLOWLIST" \
              --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
          fi
