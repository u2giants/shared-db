        if: inputs.mode == 'apply' && (inputs.historical_preview_source_pr != '' || inputs.historical_preview_source_pr_map != '')
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / "scripts"))
          from production_migration_guard import local_migrations, parse_remote_versions

