name: Shared Supabase Migrations

on:
  # DELIBERATELY NO `paths:` FILTER. A path-filtered workflow creates NO check run
  # at all on a PR that misses its paths, so a required status context stays pending
  # forever and the guard can never block a merge (see HANDOFF.md B2, PR #328/#307).
  # Only the cheap `validate` job runs on a PR; `preview` and `production-dry-run`
  # are gated on `github.event_name == 'workflow_dispatch'`.
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Supabase project to check or apply"
        type: choice
        required: true
        default: preview
        options: [preview, production]
      mode:
        description: "Preview may apply. Production apply needs immutable review evidence."
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
      production_allowlist:
        description: "Production only: comma-separated exact migration versions"
        type: string
        required: false
      preview_allowlist:
        description: "Preview only: comma-separated exact migration versions. REQUIRED for both dry-run and apply."
        type: string
        required: false
      claim_pr:
        description: "Preview only: pull request number holding the migration claim"
        type: string
        required: false
      claim_head_sha:
        description: "Preview only: exact claimed pull request head SHA"
        type: string
        required: false
      commit_sha:
        description: "Production only: exact origin/main commit SHA"
        type: string
        required: false
      confirmation:
        description: "Production: type DRY-RUN <sha> for a dry run, or APPLY <sha> to apply"
        type: string
        required: false
      review_run_id:
        description: "Production apply ONLY: successful Production Apply Review Evidence run ID"
        type: string
        required: false
      review_artifact_digest:
        description: "Production apply ONLY: pinned sha256 digest from that run's evidence artifact"
        type: string
        required: false
      source_pr:
        description: "Activated automatic policy only: merged source PR number"
        type: string
        required: false
      preview_run_id:
        description: "Activated automatic policy only: exact successful preview-apply run ID"
        type: string
        required: false
      preview_artifact_digest:
        description: "Activated automatic policy only: pinned preview evidence artifact digest"
        type: string
        required: false
      merged_preview_source_pr:
        description: "Post-merge rehearsal only: MERGED source PR whose migrations this run applies to preview. Requires commit_sha = the current main tip."
        type: string
        required: false
      merged_preview_source_pr_map:
        description: "Post-merge rehearsal only: version:pr pairs, when the bounded batch was authored by several merged PRs (AGENTS.md 6.5). Requires commit_sha = the current main tip."
        type: string
        required: false
      historical_preview_source_pr:
        description: "Preview recovery only: original merged PR that authored every allowlisted migration"
        type: string
        required: false
      historical_preview_source_pr_map:
        description: "Preview recovery only: version:pr pairs, when the batch was authored by several PRs"
        type: string
        required: false
      historical_preview_original_run_map:
        description: "Preview recovery only (REQUIRED there): version:runId pairs naming the preview run that ORIGINALLY applied each version"
        type: string
        required: false
      owner_decision_run_id:
        description: "Material-risk apply only: immutable owner-decision evidence run ID"
        type: string
        required: false
      owner_decision_artifact_digest:
        description: "Material-risk apply only: pinned owner-decision evidence artifact digest"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Pull requests get a PER-REF group so PR validations run in parallel and can never
  # queue behind (or ahead of) a production `workflow_dispatch`. Every non-PR event —
  # i.e. every `workflow_dispatch` against preview or production — keeps the SINGLE
  # global group it has always had, so dispatch serialisation is unchanged.
  group: ${{ github.event_name == 'pull_request' && format('shared-supabase-migrations-{0}', github.ref) || 'shared-supabase-migrations' }}
  cancel-in-progress: false

jobs:
  validate:
    name: SQL migration guards
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 so check-sql.sh Guard B can compare this branch's
      # migration versions against the newest version on the base branch.
      # Without full history there is no origin/<base> ref and Guard B degrades
      # to a warning-only skip instead of actually guarding.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SQL checks
        run: bash scripts/check-sql.sh
      - name: Validate hash-bound production verification sidecars
        run: node scripts/check-production-verification-sidecars.mjs --base "origin/${GITHUB_BASE_REF:-main}"
      - name: Test SQL migration guards
        run: node --test scripts/check-sql.test.mjs
      - name: Test issue 1242 contract-derived rights removal
        run: node --test scripts/check-issue-1242-contract-rights-removal.test.mjs
      # Asserts that the live plm.promote_coldlion_source_owned migration carries no
      # in-function failure recording (it can never work) AND that the runner keeps the
      # out-of-band path that actually does the job. Runs here because it reads
      # supabase/migrations, which is what this workflow guards.
      - name: Test ColdLion promotion failure-recording ownership
        run: node --test tools/coldlion-promotion-failure-recording.test.mjs
      # Asserts that NO workflow pins itself to a preview Supabase project ref. The
      # preview branch is rebuilt from time to time and its ref changes when it is, so a
      # literal silently expires: five workflows were still pinned to the ref deleted on
      # 2026-08-18 and could only fail. Runs here because this is the lane that owns the
      # preview/production identity contract.
      - name: Test that no workflow pins a preview project ref
        run: node --test scripts/check-workflow-preview-ref.test.mjs
      # Runs the post-merge rehearsal step's OWN map-parsing shell under a real
      # shell. The JavaScript lane tests could not have caught the 2026-08-21
      # one-iteration loop, because the defect was in this workflow's shell.
      - name: Test the post-merge rehearsal map parsing
        run: node --test scripts/check-workflow-rehearsal-map-parse.test.mjs
      # ISSUE #731: this step used to NAME its Python test files one by one. That is
      # exactly how scripts/test_post_batch_app_verification.py (141 tests, merged in
      # PR #719) came to sit in the repository for a whole session without executing
      # once -- it was written, it was merged, and no line here mentioned it, so every
      # pull request went green without it. An explicit list silently shrinks coverage
      # the moment somebody forgets to extend it, and nothing goes red to say so.
      #
      # It is now a GLOB over scripts/test_*.py, so a new Python test file is wired
      # into this gate the moment it is committed. Every test under that glob must pass
      # OFFLINE: no database, no network, no secrets, no project ref. If a test ever
      # needs a live database it does not belong here -- put it in supabase/tests/ and
      # let Database Contract Tests run it against the ephemeral stack.
      - name: Test every scripts/test_*.py (offline)
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(scripts/test_*.py)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No scripts/test_*.py found -- the glob or the checkout is wrong." >&2
            exit 1
          fi
          echo "Running ${#FILES[@]} Python test files:"
          printf '  %s\n' "${FILES[@]}"
          python -m unittest "${FILES[@]}"
      # Named explicitly so that deleting or renaming one of these fails the job loudly
      # instead of quietly shrinking the glob above back to a state nobody notices.
      - name: Prove the known Python suites were in that glob
        run: |
          set -euo pipefail
          for f in \
            scripts/test_production_migration_guard.py \
            scripts/test_production_catalog_verification.py \
            scripts/test_check_production_verification_sidecars.py \
            scripts/test_post_batch_app_verification.py \
            scripts/test_production_apply_review_evidence.py
          do
            if [ ! -f "$f" ]; then
              echo "::error::Expected Python test file is missing: $f" >&2
              exit 1
            fi
          done
          echo "All named Python suites present and covered by the glob above."

  # ===========================================================================
  # PREVIEW: BOUNDED, NAMED APPLY (issue #739).
  #
  # WHAT CHANGED AND WHY. This job used to run a BARE `supabase db push`. That
  # had two failure modes, both of them live on 2026-08-11:
  #
  #   1. It could not apply ANYTHING. Preview was missing four migrations, and
  #      one of them (20260810140000) sorts BELOW preview's ledger head
  #      (20260810170000, already applied there). A bare `db push` refuses that
  #      whole queue with "Found local migration files to be inserted before the
  #      last migration on remote database" and exits 1. So the lane was stuck
  #      closed with no operator control at all.
  #   2. The only escape was the CLI's include-all flag, which would have swept
  #      all four pending migrations at once. Those four belong to THREE
  #      different workstreams, including a security migration. "Apply
  #      everything pending" is not a lane; it is the absence of one.
  #
  # (This header spells that flag WITHOUT its two leading dashes on purpose.
  # `test_include_all_is_bounded_and_dry_run_only` bans the literal token by
  # plain text search everywhere above this job, and prose is not exempt from a
  # text search. The exact flag appears in the step comments below, which are
  # inside the job the test allows it in. Do not "fix" the spelling here.)
  #
  # This is now the SAME MECHANISM the production lane already uses, not a second
  # one. `scripts/production_migration_guard.py` is target-agnostic in everything
  # that matters here -- it takes a repo, an allowlist and a REMOTE LEDGER FILE,
  # and it prunes a detached checkout down to exactly `remote-ledger | allowlist`.
  # Point it at preview's ledger and it bounds preview. The bound that makes the
  # include-all flag safe is the FILESYSTEM, never the flag. Reusing this file also
  # means every policy rule inside `parse_allowlist` (HARD_BLOCKED, the AGENTS.md
  # 6.8 bundle, the 6.5 FR hold, the #660 security co-presence rules) applies to
  # preview too. That is deliberate: preview is the rehearsal for production, and
  # a rehearsal that is allowed to assemble a set production would refuse is not
  # a rehearsal.
  #
  # PREVIEW AND PRODUCTION HAVE DIVERGED IN BOTH DIRECTIONS, verified by object on
  # 2026-08-11: preview holds all 23 plm.pmt_* tables and production holds none,
  # while 20260810140000 is applied on production and not on preview. Nothing in
  # this job may assume preview is "production minus N". It reads preview's own
  # ledger every run and judges the allowlist against that and nothing else.
  #
  # THE ALLOWLIST IS REQUIRED FOR BOTH MODES. The old dry-run reported on the
  # whole pending queue, which is not what any subsequent apply would do -- an
  # honest rehearsal has to rehearse the bounded set. `preview_allowlist` is
  # therefore required for dry-run as well, and an empty one fails.
  #
  # DELIBERATELY NOT COPIED FROM THE PRODUCTION LANE:
  #   - `environment:`. Preview is the safe target; a gate that fires on harmless
  #     events trains the approver to click through (issue #646).
  #   - The typed confirmation string and the exact-origin/main-SHA check.
  #   - The review-reference gate. It is mandatory on the PRODUCTION lane (it
  #     fails that job when no reference is supplied). Preview is the safe
  #     target and does not carry it. Do not add it here.
  # ===========================================================================
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    needs: validate
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 90
    permissions:
      contents: write
      issues: read
      pull-requests: read
    env:
      # CONFIGURED, not hard-coded. The preview branch is rebuilt from time to time and its
      # project ref CHANGES when it is: on 2026-08-18 rjyboqwcdzcocqgmsyel was deleted and
      # replaced by a new branch. A literal here means this lane refuses every run until
      # someone edits this file, which is exactly what happened. Set the repository
      # variable PREVIEW_PROJECT_REF instead. The safety property is unchanged and is
      # asserted below: this job must never write to production.
      PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
      PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE: qsllyeztdwjgirsysgai
    steps:
      # FIRST STEP ON PURPOSE, before any credential is used. A lane that can be
      # pointed at the wrong project is worse than no lane, so the ref this job
      # will write to is asserted to be the preview ref AND asserted not to be the
      # production ref, as two independent checks rather than one.
      - name: Assert the target project ref is PREVIEW
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          set -euo pipefail
          echo "PROJECT REF THIS JOB WILL WRITE TO: $PREVIEW_PROJECT_REF"
          if [ -z "${PREVIEW_PROJECT_REF// /}" ]; then
            echo "REFUSED: repository variable PREVIEW_PROJECT_REF is not set. Set it to the CURRENT preview branch project ref. An unset ref is never treated as a default." >&2
            exit 1
          fi
          if ! printf '%s' "$PREVIEW_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "REFUSED: PREVIEW_PROJECT_REF is not a 20-character Supabase project ref." >&2
            exit 1
          fi
          if [ "$PREVIEW_PROJECT_REF" = "$PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE" ]; then
            echo "REFUSED: preview job is pointed at PRODUCTION ($PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE)." >&2
            exit 1
          fi
          echo "REF OK: preview = $PREVIEW_PROJECT_REF (production $PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE is not this job's target)."
          if [ -z "${PREVIEW_ALLOWLIST// /}" ]; then
            echo "REFUSED: preview_allowlist is empty. This lane applies ONLY the versions you name, in dry-run and in apply alike. Name them." >&2
            exit 1
          fi
      # fetch-depth: 0 because `production_migration_guard.py prepare` builds the
      # bounded set with `git worktree add --detach <sha>`, which needs the object.
      - uses: actions/checkout@v4
        with:
          # A post-merge rehearsal and a historical recovery both check out the
          # exact main tip named by commit_sha. Only the ordinary pre-merge lane
          # checks out a pull-request head.
          ref: ${{ (inputs.merged_preview_source_pr != '' || inputs.merged_preview_source_pr_map != '' || inputs.historical_preview_source_pr != '' || inputs.historical_preview_source_pr_map != '') && inputs.commit_sha || inputs.claim_head_sha }}
          fetch-depth: 0
      # POST-MERGE PREVIEW REHEARSAL (#1208). This is the step that makes
      # "merge first, then rehearse on preview from merged main, then promote"
      # executable. Its authorisation is merge-commit ancestry of the current
      # main tip, NOT a live author claim -- the guarded merge released the claim
      # and deleted the branch, which is precisely why the old order could never
      # be run. Every check below fails closed and says what was missing.
      - name: Prove the post-merge rehearsal source
        id: merged_rehearsal
        if: (inputs.merged_preview_source_pr != '' || inputs.merged_preview_source_pr_map != '')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ inputs.merged_preview_source_pr }}
          SOURCE_MAP: ${{ inputs.merged_preview_source_pr_map }}
          MAIN_SHA: ${{ inputs.commit_sha }}
          HISTORICAL_SOURCE_PR: ${{ inputs.historical_preview_source_pr }}
          HISTORICAL_SOURCE_MAP: ${{ inputs.historical_preview_source_pr_map }}
          CLAIM_PR: ${{ inputs.claim_pr }}
        run: |
          set -euo pipefail
          # TWO LANES DESCRIBING ONE RUN IS NOT A STATE THIS JOB RUNS IN.
          if [ -n "${HISTORICAL_SOURCE_PR:-}" ] || [ -n "${HISTORICAL_SOURCE_MAP:-}" ]; then
            echo "REFUSED: merged_preview_source_pr is a post-merge APPLY; the historical inputs are a no-write recovery. Name one." >&2
            exit 1
          fi
          if [ -n "${CLAIM_PR:-}" ]; then
            echo "REFUSED: merged_preview_source_pr replaces claim_pr. A merged pull request has no live author claim; do not name both." >&2
            exit 1
          fi
          if [ -z "${MAIN_SHA:-}" ]; then
            echo "REFUSED: a post-merge rehearsal must name commit_sha, the exact current main tip it rehearses." >&2
            exit 1
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          MAIN_SHA="$MAIN_SHA" node scripts/check-main-tip-freshness.mjs
          # A batch that AGENTS.md 6.5 requires to move as ONE bounded event can
          # span several authoring pull requests, so it names a source PR per
          # version. BOTH SET IS REFUSED HERE for the same reason the historical
          # lane refuses it: two inputs describing one batch, one of them quietly
          # unused, is not a state a gate should run in.
          if [ -n "${SOURCE_MAP:-}" ] && [ -n "${SOURCE_PR:-}" ]; then
            echo "REFUSED: name merged_preview_source_pr OR merged_preview_source_pr_map, not both." >&2
            exit 1
          fi
          if [ -n "${SOURCE_MAP:-}" ]; then
            # EVERY pull request in the map is proved merged here, not only the
            # one the lane lock is filed under. The per-version merge-commit
            # ancestry and authorship proofs run in the lane script below.
            #
            # THE PARSE IS UNDER TEST. scripts/check-workflow-rehearsal-map-parse.test.mjs
            # lifts the block between the two markers below out of this file and
            # runs it under a real shell. Keep the markers, and keep everything
            # between them free of anything the test cannot run (no `gh`, no
            # network, no repository state) -- see the count guard for why.
            # >>> BEGIN map-parse (covered by scripts/check-workflow-rehearsal-map-parse.test.mjs)
            # `tr -d '[:space:]'` WAS HERE AND IT DELETED THE NEWLINES TOO, gluing
            # `408 1108 1142 1145 1256 1347` into the single token
            # 40811081142114512561347. The loop then ran ONCE against a pull
            # request that does not exist (runs 32481867839 and 32482067440).
            # `sed 's/[[:space:]]//g'` trims per LINE, so the line structure the
            # loop depends on survives.
            MAP_PRS="$(printf '%s' "$SOURCE_MAP" | tr ',' '\n' | sed -e 's/.*://' -e 's/[[:space:]]//g' | grep -v '^$' | sort -u)"
            test -n "$MAP_PRS"
            # THE COUNT GUARD. A loop that silently runs once instead of six
            # times is the exact failure this step already shipped, so the parse
            # is now checked against a SECOND, independent parse (awk, not the
            # pipeline above). They must agree. If they ever disagree the step
            # stops and says so; it never proceeds having proved less than it
            # claims.
            MAP_PR_COUNT="$(printf '%s\n' "$MAP_PRS" | grep -c '.')"
            EXPECTED_PR_COUNT="$(printf '%s' "$SOURCE_MAP" | awk -F, '{for (i = 1; i <= NF; i++) { n = split($i, kv, ":"); pr = kv[n]; gsub(/[[:space:]]/, "", pr); if (pr != "") seen[pr] = 1 }} END {print length(seen)}')"
            if [ "$MAP_PR_COUNT" != "$EXPECTED_PR_COUNT" ]; then
              echo "REFUSED: merged_preview_source_pr_map parsed to ${MAP_PR_COUNT} pull request(s) but names ${EXPECTED_PR_COUNT}. Refusing rather than proving fewer pull requests merged than the map claims." >&2
              exit 1
            fi
            # The lane lock, and therefore the evidence binding, is filed under
            # the LAST pull request in the map -- the same convention the
            # historical recovery lane already uses, chosen because it is the
            # most recent authorship and the one a reader recognises. Taken from
            # the parsed entries rather than `${SOURCE_MAP##*:}` so trailing
            # whitespace or a trailing comma cannot smuggle a bad value through.
            MAP_LAST_PR="$(printf '%s' "$SOURCE_MAP" | tr ',' '\n' | sed -e 's/.*://' -e 's/[[:space:]]//g' | grep -v '^$' | tail -1)"
            # <<< END map-parse
            for MAP_PR in $MAP_PRS; do
              case "$MAP_PR" in *[!0-9]*|"")
                echo "REFUSED: merged_preview_source_pr_map names a non-numeric pull request: ${MAP_PR}" >&2
                exit 1 ;;
              esac
              MAP_MERGED="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MAP_PR}" --jq '.merged')"
              MAP_MERGE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${MAP_PR}" --jq '.merge_commit_sha // ""')"
              if [ "$MAP_MERGED" != "true" ] || [ -z "$MAP_MERGE_SHA" ]; then
                echo "REFUSED: pull request #${MAP_PR} is not merged. A post-merge rehearsal never runs from unmerged code." >&2
                exit 1
              fi
            done
            echo "merged_preview_source_pr_map: proved ${MAP_PR_COUNT} pull request(s) merged: $(printf '%s' "$MAP_PRS" | tr '\n' ' ')"
            SOURCE_PR="$MAP_LAST_PR"
          fi
          MERGE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" --jq '.merge_commit_sha // ""')"
          MERGED="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" --jq '.merged')"
          if [ "$MERGED" != "true" ] || [ -z "$MERGE_SHA" ]; then
            echo "REFUSED: pull request #${SOURCE_PR} is not merged. A post-merge rehearsal never runs from unmerged code." >&2
            exit 1
          fi
          echo "merge_commit_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_pr=$SOURCE_PR" >> "$GITHUB_OUTPUT"
      - name: Prove historical preview recovery source
        if: (inputs.historical_preview_source_pr != '' || inputs.historical_preview_source_pr_map != '')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ inputs.historical_preview_source_pr }}
          SOURCE_MAP: ${{ inputs.historical_preview_source_pr_map }}
          MERGED_SOURCE_MAP: ${{ inputs.merged_preview_source_pr_map }}
          ORIGINAL_RUN_MAP: ${{ inputs.historical_preview_original_run_map }}
          MAIN_SHA: ${{ inputs.commit_sha }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          set -euo pipefail
          # The merged map is the post-merge APPLY lane, exactly as the single
          # merged PR is; the historical inputs are a no-write recovery.
          if [ -n "${MERGED_SOURCE_MAP:-}" ]; then
            echo "REFUSED: merged_preview_source_pr_map is a post-merge APPLY; the historical inputs are a no-write recovery. Name one." >&2
            exit 1
          fi
          test -n "$MAIN_SHA"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          MAIN_SHA="$MAIN_SHA" node scripts/check-main-tip-freshness.mjs
          # A batch authored across several pull requests names a source PR per
          # version; a single-PR batch keeps the original form.
          #
          # BOTH SET IS REFUSED HERE, not left to the script. Passing only
          # --source-map would mean the script's own mutual-exclusion check never
          # fires, so the single-PR input would be silently ignored by the proof
          # while still selecting the lane-lock PR below. Two different inputs
          # describing one batch, one of them quietly unused, is not a state a
          # production gate should run in.
          if [ -n "${SOURCE_MAP:-}" ] && [ -n "${SOURCE_PR:-}" ]; then
            echo "REFUSED: name historical_preview_source_pr OR historical_preview_source_pr_map, not both." >&2
            exit 1
          fi
          if [ -n "${SOURCE_MAP:-}" ]; then
            SELECTOR=(--source-map "$SOURCE_MAP")
          else
            SELECTOR=(--source-pr "$SOURCE_PR")
          fi
          # THE BYTE BINDING. A recovery run writes nothing, so it can never
          # produce a content manifest of its own. Naming the run that ORIGINALLY
          # applied each version is what lets the production gate compare the
          # bytes preview really executed against exact main. Without it the lane
          # proves authorship and ledger presence only, and "rehearse A, amend to
          # B, merge, recover, promote B" would pass. It is refused here as well
          # as in the script, so the failure names the missing INPUT.
          if [ -z "${ORIGINAL_RUN_MAP:-}" ]; then
            echo "REFUSED: historical preview recovery requires historical_preview_original_run_map (version:runId pairs naming the preview run that originally applied each version)." >&2
            exit 1
          fi
          python scripts/historical_preview_recovery.py "${SELECTOR[@]}" \
            --main-sha "$MAIN_SHA" --allowlist "$PREVIEW_ALLOWLIST" \
            --original-run-map "$ORIGINAL_RUN_MAP" \
            --output "$RUNNER_TEMP/historical-preview-source.json"
      - name: Acquire the exclusive GitHub-backed preview lane
        id: preview_lock
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_PR: ${{ inputs.claim_pr }}
          CLAIM_HEAD_SHA: ${{ inputs.claim_head_sha }}
          HISTORICAL_SOURCE_PR: ${{ inputs.historical_preview_source_pr }}
          HISTORICAL_SOURCE_MAP: ${{ inputs.historical_preview_source_pr_map }}
          HISTORICAL_MAIN_SHA: ${{ inputs.commit_sha }}
          MERGED_SOURCE_PR: ${{ steps.merged_rehearsal.outputs.source_pr }}
          MERGED_SOURCE_MAP: ${{ inputs.merged_preview_source_pr_map }}
          MERGED_MAIN_SHA: ${{ inputs.commit_sha }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          set -euo pipefail
          # A map-authored batch has no single source PR, so the lock is claimed
          # against the LAST PR in the map. Any one of them identifies the batch;
          # the last is chosen because it is the most recent authorship and is
          # what a reader will recognise. Without this, a map-only recovery run
          # would fall through to the ordinary preview lock with an empty claim.
          if [ -z "$HISTORICAL_SOURCE_PR" ] && [ -n "${HISTORICAL_SOURCE_MAP:-}" ]; then
            HISTORICAL_SOURCE_PR="${HISTORICAL_SOURCE_MAP##*:}"
          fi
          if [ -n "$HISTORICAL_SOURCE_PR" ]; then
            CLAIM_PR="$HISTORICAL_SOURCE_PR"
            CLAIM_HEAD_SHA="$HISTORICAL_MAIN_SHA"
          fi
          # A POST-MERGE REHEARSAL claims the same exclusive preview ref, so it
          # cannot run alongside an ordinary preview run or a historical
          # recovery. IT DOES NOT EXCLUDE A MERGE OR A PROMOTION -- merge and
          # production hold their own refs and neither reads the preview ref.
          # That is the pre-existing behaviour of the ordinary preview lane, not
          # something this lane loosened; an earlier version of this comment
          # claimed the wider exclusion and it was never true (#1213 round 8,
          # finding 3). A rehearsal still cannot overlap a production apply,
          # because both are workflow_dispatch runs of this workflow and share
          # one `concurrency` group. What differs from an ordinary preview claim
          # is only the AUTHORISATION: merge-commit ancestry of the main tip
          # instead of a live author claim on a branch that no longer exists.
          LANE_VERSIONS=()
          if [ -n "${MERGED_SOURCE_PR:-}" ]; then
            CLAIM_PR="$MERGED_SOURCE_PR"
            CLAIM_HEAD_SHA="$MERGED_MAIN_SHA"
            LANE_VERSIONS=(--versions "$PREVIEW_ALLOWLIST")
            # A batch authored across several merged pull requests passes the
            # version-to-PR map through to the lane script, which proves EVERY
            # allowlisted version was added by a merged pull request whose merge
            # commit is contained in this exact main tip. Per version instead of
            # per batch; never optional, never skippable.
            if [ -n "${MERGED_SOURCE_MAP:-}" ]; then
              LANE_VERSIONS+=(--version-pr-map "$MERGED_SOURCE_MAP")
            fi
          fi
          test -n "$CLAIM_PR"; test -n "$CLAIM_HEAD_SHA"
          LOCK_KIND=preview
          if [ -n "$HISTORICAL_SOURCE_PR" ]; then LOCK_KIND=preview-recovery; fi
          if [ -n "${MERGED_SOURCE_PR:-}" ]; then LOCK_KIND=preview-rehearsal; fi
          node scripts/manage-migration-author-lanes.mjs --acquire-$LOCK_KIND \
            --owner "github-actions:${GITHUB_RUN_ID}" --pr "$CLAIM_PR" --head-sha "$CLAIM_HEAD_SHA" \
            "${LANE_VERSIONS[@]}" \
