          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
          SOURCE_PR: ${{ inputs.source_pr }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ARTIFACT_DIGEST: ${{ inputs.review_artifact_digest }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          PREVIEW_ARTIFACT_DIGEST: ${{ inputs.preview_artifact_digest }}
          # CONFIGURED, never a literal. The production gate must know which
          # preview database the rehearsal was allowed to run against, and the
          # answer changes whenever preview is rebuilt.
          PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
          OWNER_DECISION_RUN_ID: ${{ inputs.owner_decision_run_id }}
          OWNER_DECISION_ARTIFACT_DIGEST: ${{ inputs.owner_decision_artifact_digest }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_PR"
          test -n "$PREVIEW_RUN_ID"
          test -n "$PREVIEW_ARTIFACT_DIGEST"
          if [ -z "${PREVIEW_PROJECT_REF// /}" ]; then
            echo "REFUSED: repository variable PREVIEW_PROJECT_REF is not set. The production gate cannot check which preview database the rehearsal ran against, and an unset ref is never treated as a default." >&2
            exit 1
          fi
          python scripts/production_business_risk_gate.py \
            --main-sha "$REQUESTED_SHA" --allowlist "$PRODUCTION_ALLOWLIST" \
            --pr "$SOURCE_PR" --review-run-id "$REVIEW_RUN_ID" \
            --review-digest "$REVIEW_ARTIFACT_DIGEST" \
            --preview-run-id "$PREVIEW_RUN_ID" --preview-digest "$PREVIEW_ARTIFACT_DIGEST" \
            --preview-project-ref "$PREVIEW_PROJECT_REF" \
            --owner-decision-run-id "$OWNER_DECISION_RUN_ID" \
            --owner-decision-digest "$OWNER_DECISION_ARTIFACT_DIGEST" \
            | tee "$RUNNER_TEMP/production-business-risk-evidence.json"
      - name: Upload pre-approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-apply-review-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/production-ledger-before.txt
            ${{ runner.temp }}/production-apply-review-evidence.json
            ${{ runner.temp }}/production-business-risk-evidence.json
          if-no-files-found: warn
          retention-days: 90
