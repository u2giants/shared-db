  # ===========================================================================
  # PRODUCTION APPLY (issue #617). The only job in this repo that writes to
  # qsllyeztdwjgirsysgai.
  #
  # THREE INDEPENDENT GATES, and none of them is sufficient alone:
  #   1. `production-apply-review` -- deterministic, machine-checkable. The typed
  #      confirmation string, the exact origin/main SHA, and the full guard chain
  #      (parse_allowlist -> HARD_BLOCKED / 6.8 bundle / 6.5 hold / co-presence,
  #      then validate_candidates, then whole-batch preflight). This job FAILS the
  #      run on its own findings.
  #   2. IMMUTABLE REVIEW EVIDENCE. A separate non-writing workflow records the
  #      authenticated reviewer actor, APPROVE verdict, exact current main SHA,
  #      and exact ordered allowlist. This lane pins that run and artifact by
  #      ID plus SHA-256, then verifies both through GitHub before and after the
  #      environment wait. URLs, paths, stale runs, reordered lists, and altered
  #      artifacts fail closed.
  #   3. `environment: production` remains the deployment boundary. Its manual
  #      reviewer rule is removed only in the separate owner-approved phase;
  #      this workflow keeps the environment binding unchanged.
  # ===========================================================================
  production-apply-review:
    name: Production apply review (immutable evidence + hard guards)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.mode == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    env:
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
    steps:
      # FIRST STEP ON PURPOSE. A wrong confirmation string must fail before any
      # credential is used, any checkout happens, and any approval is requested.
      - name: Check exact confirmation
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          test -n "$REQUESTED_SHA"
          test -n "$PRODUCTION_ALLOWLIST"
          test "$REQUESTED_CONFIRMATION" = "APPLY $REQUESTED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          MAIN_SHA="$REQUESTED_SHA" node scripts/check-main-tip-freshness.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - name: Ensure a working PostgreSQL client (psql)
        run: |
          set -euo pipefail

          # WHY THIS IS NOT JUST `apt-get install postgresql-client` (issue #1261)
          # ---------------------------------------------------------------------
          # The hosted runner image ALREADY ships a PostgreSQL client, so the apt
          # install was buying nothing and risking everything. On 2026-08-19 a stalled
          # `apt-get update` against azure.archive.ubuntu.com consumed an entire
          # 45-minute job budget five times across three PRs; every later step was
          # skipped, so NOT ONE LINE OF SQL RAN -- and it surfaced as a plain red X,
          # indistinguishable from a genuine failure. That is the hosted-runner
          # starvation mode described in AGENTS.md 5.2-A.
          #
          # So: prove the client FIRST and skip apt entirely when it is already there;
          # if apt is genuinely needed, bound every command with `timeout` and retry
          # with backoff; and if a working client still cannot be had, fail FAST and
          # BY NAME so nobody mistakes an infrastructure stall for a fault in the
          # change under review. This step never continues without a real client --
          # failing loudly is the point.
          if command -v psql >/dev/null 2>&1 && psql --version; then
            echo "psql already present on the runner image; no apt install needed."
            exit 0
          fi

          echo "::warning::psql absent from the runner image; falling back to apt."
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if timeout --kill-after=10 60 sudo apt-get update \
              && timeout --kill-after=10 120 sudo apt-get install -y --no-install-recommends postgresql-client; then
              if command -v psql >/dev/null 2>&1 && psql --version; then
                echo "psql installed and proved working on attempt ${i}."
                exit 0
              fi
            fi
            echo "::warning::psql install attempt ${i} of ${attempts} failed or timed out."
            # No backoff after the LAST attempt: it would only delay the
            # named error below by a further 30s. The worst-case budget is
            # 3*(60+120)+10+20 = 570s, which must stay inside the TIGHTEST
            # job ceiling that runs this block (`reconcile`, 15 minutes).
            # Shorten the budget, never raise the ceiling -- a generic job
            # timeout would swallow the named diagnostic exactly when it
            # is needed, which is the whole defect of #1261.
            if [ "$i" -lt "$attempts" ]; then
              sleep $(( i * 10 ))
            fi
          done

          echo "::error::CI INFRASTRUCTURE: PostgreSQL client unavailable after ${attempts} attempts (apt mirror stall on the hosted runner -- NOT a fault in the change under review); NO MIGRATION WAS APPLIED"
          exit 1
