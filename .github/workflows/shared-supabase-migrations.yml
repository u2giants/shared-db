          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
          # Labels the summary only. It never selects behaviour.
          RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          from pathlib import Path
          from production_migration_guard import local_migrations, parse_remote_versions

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          ledger = Path(os.environ["RUNNER_TEMP"]) / "preview-ledger-before.txt"
          named = [v.strip() for v in os.environ["PREVIEW_ALLOWLIST"].split(",") if v.strip()]
          local = local_migrations(repo)
          remote = parse_remote_versions(ledger)
          pending = sorted(set(local) - remote)

          print("## Preview bounded apply")
          print()
          print(f"Project ref: `{os.environ['PREVIEW_PROJECT_REF']}` (PREVIEW)")
          print(f"Mode: `{os.environ.get('RUN_MODE', 'n/a')}`")
          print(f"Preview ledger rows before: {len(remote)}")
          print()
          print(f"### WILL APPLY ({len(named)} named)")
          for v in named:
              print(f"- {v} {local[v].name if v in local else '(NOT ON DISK)'}")
          skipped = [v for v in pending if v not in set(named)]
          print()
          print(f"### WILL SKIP ({len(skipped)} pending but not named)")
          for v in skipped:
              print(f"- {v} {local[v].name}")
          if not skipped:
              print("- (none)")
          print()
          print("Everything else on disk is already in the preview ledger.")
          PY
      - name: Hard guard preflight
        if: (inputs.historical_preview_source_pr == '' && inputs.historical_preview_source_pr_map == '')
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          # Fails loudly on: an empty allowlist, a non-14-digit entry, a duplicate,
          # an out-of-order list, a version that is NOT ON DISK, a version ALREADY
          # IN THE PREVIEW LEDGER, and any batch whose non-deferrable dependencies
          # cannot resolve. Same code path as production, judged against preview's
          # own ledger.
          #
