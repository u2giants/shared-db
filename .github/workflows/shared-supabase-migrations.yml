          # production migrations sort BELOW the remote ledger head, and the CLI
          # refuses to insert those without it. AGENTS.md 5.1(4) licenses this
          # against a verified bounded set; the prohibition is on --include-all
          # against the FULL repo set, which this is not. Never add this flag to
          # a `supabase db push` that runs in $GITHUB_WORKSPACE.
          ATOMIC_VERSION="$(python "$GITHUB_WORKSPACE/scripts/atomic_migration_apply.py" \
