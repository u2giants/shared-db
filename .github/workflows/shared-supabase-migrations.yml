          else
            supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/preview-dry-run.txt"
            python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
              --dry-run-output "$RUNNER_TEMP/preview-dry-run.txt" \
              --allowlist "$PREVIEW_ALLOWLIST" \
              --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
            # THE WRITE. Preview only.
            supabase db push --include-all 2>&1 | tee "$RUNNER_TEMP/preview-apply.txt"
          fi
