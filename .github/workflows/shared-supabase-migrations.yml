          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          from pathlib import Path
          from production_migration_guard import parse_remote_versions

          tmp = Path(os.environ["RUNNER_TEMP"])
          before_p, after_p = tmp / "preview-ledger-before.txt", tmp / "preview-ledger-after.txt"
          if not (before_p.exists() and after_p.exists()):
              print("### Preview ledger delta: NOT AVAILABLE (a ledger read did not complete)")
              raise SystemExit(0)
          before, after = parse_remote_versions(before_p), parse_remote_versions(after_p)
          print("### Preview ledger delta")
          print(f"- rows before: {len(before)}")
          print(f"- rows after:  {len(after)}")
          print(f"- added: {', '.join(sorted(after - before)) or '(none)'}")
          print(f"- removed: {', '.join(sorted(before - after)) or '(none)'}")
          PY
      # WHICH COMMIT, AND WHICH DATABASE. Written from the values THIS job used,
      # travelling in the same artifact as the ledgers and apply logs, and
      # re-checked by the production gate. Without it, a rehearsal against the
      # DELETED preview rjyboqwcdzcocqgmsyel would still read as proof about the
      # rebuilt one. See scripts/preview_instance_binding.py.
      - name: Bind this rehearsal to its commit and its preview database
        # success() is EXPLICIT because a custom `if:` replaces GitHub's default.
        # Without it a FAILED bounded apply still wrote an instance binding, and
        # the `if: always()` upload still shipped it. Evidence is only written
        # for an apply that actually succeeded.
        if: success() && inputs.mode == 'apply'
        env:
          APPLIED_COMMIT: ${{ steps.commit.outputs.sha }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
          MERGED_SOURCE_PR: ${{ steps.merged_rehearsal.outputs.source_pr }}
          MERGE_COMMIT_SHA: ${{ steps.merged_rehearsal.outputs.merge_commit_sha }}
          HISTORICAL_SOURCE_PR: ${{ inputs.historical_preview_source_pr }}
          HISTORICAL_SOURCE_MAP: ${{ inputs.historical_preview_source_pr_map }}
        run: |
          set -euo pipefail
          MODE=claim
          if [ -n "${MERGED_SOURCE_PR:-}" ]; then MODE=merged-main-rehearsal; fi
          if [ -n "${HISTORICAL_SOURCE_PR:-}" ] || [ -n "${HISTORICAL_SOURCE_MAP:-}" ]; then MODE=historical-recovery; fi
          python scripts/preview_instance_binding.py \
            --applied-commit "$APPLIED_COMMIT" \
            --preview-project-ref "$PREVIEW_PROJECT_REF" \
            --production-project-ref "$PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE" \
            --run-id "$GITHUB_RUN_ID" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --rehearsal-mode "$MODE" \
            --source-pr "${MERGED_SOURCE_PR:-}" \
            --merge-commit-sha "${MERGE_COMMIT_SHA:-}" \
            --output "$RUNNER_TEMP/preview-instance.json"
