      - name: Release the exclusive preview lane with ownership proof
        if: always() && steps.preview_lock.outputs.owner_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_SHA: ${{ steps.preview_lock.outputs.owner_sha }}
        # Every preview lane kind writes the SAME ref, so one release covers all
        # three. Named --release-preview because that is the ref's name.
        run: node scripts/manage-migration-author-lanes.mjs --release-preview --owner-sha "$OWNER_SHA"

  # ISSUE #646: this job deliberately has NO `environment:`.
  #
  # It used to carry `environment: production`, which meant Albert was asked to
  # approve every PRACTICE RUN. A gate that fires on harmless events trains the
  # person holding it to click approve without reading -- which is exactly the
  # habit you do not want on the one run that writes to production. The gate now
  # guards ONLY the real change (`production-apply` below).
  #
  # This job cannot write: it runs `supabase db push --dry-run` and nothing else.
  # `supabase link` and `supabase migration list` are reads. If you ever add a
  # mutating command to this job, put the environment back FIRST.
  production-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.mode == 'dry-run'
    needs: validate
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 90
    env:
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
    steps:
      - name: Check exact confirmation
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test -n "$REQUESTED_SHA"
          test "$REQUESTED_CONFIRMATION" = "DRY-RUN $REQUESTED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          MAIN_SHA="$REQUESTED_SHA" node scripts/check-main-tip-freshness.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - name: Ensure a working PostgreSQL client (psql)
        run: |
          set -euo pipefail

          # WHY THIS IS NOT JUST `apt-get install postgresql-client` (issue #1261)
          # ---------------------------------------------------------------------
          # The hosted runner image ALREADY ships a PostgreSQL client, so the apt
          # install was buying nothing and risking everything. On 2026-08-19 a stalled
          # `apt-get update` against azure.archive.ubuntu.com consumed an entire
          # 45-minute job budget five times across three PRs; every later step was
          # skipped, so NOT ONE LINE OF SQL RAN -- and it surfaced as a plain red X,
          # indistinguishable from a genuine failure. That is the hosted-runner
          # starvation mode described in AGENTS.md 5.2-A.
          #
          # So: prove the client FIRST and skip apt entirely when it is already there;
          # if apt is genuinely needed, bound every command with `timeout` and retry
          # with backoff; and if a working client still cannot be had, fail FAST and
          # BY NAME so nobody mistakes an infrastructure stall for a fault in the
          # change under review. This step never continues without a real client --
          # failing loudly is the point.
          if command -v psql >/dev/null 2>&1 && psql --version; then
            echo "psql already present on the runner image; no apt install needed."
            exit 0
          fi

          echo "::warning::psql absent from the runner image; falling back to apt."
          attempts=3
          for i in $(seq 1 "$attempts"); do
            if timeout --kill-after=10 60 sudo apt-get update \
              && timeout --kill-after=10 120 sudo apt-get install -y --no-install-recommends postgresql-client; then
              if command -v psql >/dev/null 2>&1 && psql --version; then
                echo "psql installed and proved working on attempt ${i}."
                exit 0
              fi
            fi
            echo "::warning::psql install attempt ${i} of ${attempts} failed or timed out."
            # No backoff after the LAST attempt: it would only delay the
            # named error below by a further 30s. The worst-case budget is
            # 3*(60+120)+10+20 = 570s, which must stay inside the TIGHTEST
            # job ceiling that runs this block (`reconcile`, 15 minutes).
            # Shorten the budget, never raise the ceiling -- a generic job
            # timeout would swallow the named diagnostic exactly when it
            # is needed, which is the whole defect of #1261.
            if [ "$i" -lt "$attempts" ]; then
              sleep $(( i * 10 ))
            fi
          done

          echo "::error::CI INFRASTRUCTURE: PostgreSQL client unavailable after ${attempts} attempts (apt mirror stall on the hosted runner -- NOT a fault in the change under review); NO MIGRATION WAS APPLIED"
          exit 1
      - name: Capture production migration record
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Build bounded checkout
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          python scripts/production_migration_guard.py prepare \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/bounded-production" \
            --commit-sha "$REQUESTED_SHA" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Run and verify bounded dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-production"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          # Re-prove the checkout is still bounded AT THE POINT OF USE, and keep
          # this the LAST command before the push so nothing can run in between.
          # The bound that makes --include-all safe below is the FILESYSTEM, not
          # the flag: `prepare` keeps exactly `remote-ledger | allowlist` on disk
          # and deletes everything else, so --include-all cannot reach a migration
          # that is not on the allowlist. This re-check exists because `prepare`
          # ran in an earlier step, and it sits after `supabase link` so that no
          # question about what `link` may write can make it inert.
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-production" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
