      # run will apply and the exact set it will leave alone. The skip list is
      # computed from the same two inputs the guard uses -- local files and the
      # preview ledger read seconds ago -- so a reader can see every pending
      # migration this run is choosing NOT to touch, by version.
      - name: Announce the bounded set (apply list and skip list)
