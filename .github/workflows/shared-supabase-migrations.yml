            --repo "$GITHUB_WORKSPACE" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
      - name: Build bounded checkout
        if: (inputs.historical_preview_source_pr == '' && inputs.historical_preview_source_pr_map == '')
