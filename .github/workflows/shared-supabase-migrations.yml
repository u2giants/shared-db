          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-preview"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          # Re-prove the bound AT THE POINT OF USE, after `link`, as the last
          # command before the push. `prepare` ran in an earlier step.
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-preview" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
