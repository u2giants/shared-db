name: Shared Supabase Migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-sql.sh"
      - "scripts/production_migration_guard.py"
      - "scripts/test_production_migration_guard.py"
      - ".github/workflows/shared-supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Supabase project to check or apply"
        type: choice
        required: true
        default: preview
        options: [preview, production]
      mode:
        description: "Preview may apply. Production is dry-run only here."
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
      production_allowlist:
        description: "Production only: comma-separated exact migration versions"
        type: string
        required: false
      commit_sha:
        description: "Production only: exact origin/main commit SHA"
        type: string
        required: false
      confirmation:
        description: "Production only: type DRY-RUN followed by the commit SHA"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: shared-supabase-migrations
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQL check dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run SQL checks
        run: bash scripts/check-sql.sh
      - name: Test production guard
        run: python -m unittest scripts/test_production_migration_guard.py

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    needs: validate
    runs-on: ubuntu-latest
    env:
      PREVIEW_PROJECT_REF: rjyboqwcdzcocqgmsyel
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dry-run preview
        if: inputs.mode == 'dry-run'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
        run: supabase db push --dry-run
      - name: Apply preview
        if: inputs.mode == 'apply'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
        run: supabase db push

  production-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
    steps:
      - name: Refuse production apply
        if: inputs.mode == 'apply'
        run: |
          echo "BLOCKED: the general workflow can never apply to production." >&2
          exit 1
      - name: Check exact confirmation
        run: |
          test -n "${{ inputs.commit_sha }}"
          test "${{ inputs.confirmation }}" = "DRY-RUN ${{ inputs.commit_sha }}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify exact main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.commit_sha }}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Capture production migration record
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Build bounded checkout
        run: |
          python scripts/production_migration_guard.py prepare \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/bounded-production" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --allowlist "${{ inputs.production_allowlist }}" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Run and verify bounded dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          cd "$RUNNER_TEMP/bounded-production"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/production-dry-run.txt"
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
            --dry-run-output "$RUNNER_TEMP/production-dry-run.txt" \
            --allowlist "${{ inputs.production_allowlist }}"
      - name: Save dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-dry-run-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/production-ledger-before.txt
            ${{ runner.temp }}/production-dry-run.txt
          retention-days: 90
