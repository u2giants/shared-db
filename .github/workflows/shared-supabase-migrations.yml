          REVIEW_ARTIFACT_DIGEST: ${{ inputs.review_artifact_digest }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          python scripts/production_apply_review_evidence.py \
            --review-run-id "$REVIEW_RUN_ID" \
            --expected-artifact-digest "$REVIEW_ARTIFACT_DIGEST" \
            --commit-sha "$REQUESTED_SHA" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --output-dir "$RUNNER_TEMP"
      - name: Detect machine-enforced policy activation
        id: policy_activation
        run: |
          set -euo pipefail
          active="$(jq -r 'if .active == true then "true" elif .active == false then "false" else error("activation must be boolean") end' config/production-risk-policy-activation.json)"
          echo "active=$active" >> "$GITHUB_OUTPUT"
