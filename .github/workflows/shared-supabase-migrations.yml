name: Shared Supabase Migrations

on:
  # DELIBERATELY NO `paths:` FILTER. A path-filtered workflow creates NO check run
  # at all on a PR that misses its paths, so a required status context stays pending
  # forever and the guard can never block a merge (see HANDOFF.md B2, PR #328/#307).
  # Only the cheap `validate` job runs on a PR; `preview` and `production-dry-run`
  # are gated on `github.event_name == 'workflow_dispatch'`.
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Supabase project to check or apply"
        type: choice
        required: true
        default: preview
        options: [preview, production]
      mode:
        description: "Preview may apply. Production apply needs environment approval."
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
      production_allowlist:
        description: "Production only: comma-separated exact migration versions"
        type: string
        required: false
      preview_allowlist:
        description: "Preview only: comma-separated exact migration versions. REQUIRED for both dry-run and apply."
        type: string
        required: false
      commit_sha:
        description: "Production only: exact origin/main commit SHA"
        type: string
        required: false
      confirmation:
        description: "Production: type DRY-RUN <sha> for a dry run, or APPLY <sha> to apply"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Pull requests get a PER-REF group so PR validations run in parallel and can never
  # queue behind (or ahead of) a production `workflow_dispatch`. Every non-PR event —
  # i.e. every `workflow_dispatch` against preview or production — keeps the SINGLE
  # global group it has always had, so dispatch serialisation is unchanged.
  group: ${{ github.event_name == 'pull_request' && format('shared-supabase-migrations-{0}', github.ref) || 'shared-supabase-migrations' }}
  cancel-in-progress: false

jobs:
  validate:
    name: SQL migration guards
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so check-sql.sh Guard B can compare this branch's
      # migration versions against the newest version on the base branch.
      # Without full history there is no origin/<base> ref and Guard B degrades
      # to a warning-only skip instead of actually guarding.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SQL check dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run SQL checks
        run: bash scripts/check-sql.sh
      - name: Test SQL migration guards
        run: node --test scripts/check-sql.test.mjs
      # Asserts that the live plm.promote_coldlion_source_owned migration carries no
      # in-function failure recording (it can never work) AND that the runner keeps the
      # out-of-band path that actually does the job. Runs here because it reads
      # supabase/migrations, which is what this workflow guards.
      - name: Test ColdLion promotion failure-recording ownership
        run: node --test tools/coldlion-promotion-failure-recording.test.mjs
      # ISSUE #731: this step used to NAME its Python test files one by one. That is
      # exactly how scripts/test_post_batch_app_verification.py (141 tests, merged in
      # PR #719) came to sit in the repository for a whole session without executing
      # once -- it was written, it was merged, and no line here mentioned it, so every
      # pull request went green without it. An explicit list silently shrinks coverage
      # the moment somebody forgets to extend it, and nothing goes red to say so.
      #
      # It is now a GLOB over scripts/test_*.py, so a new Python test file is wired
      # into this gate the moment it is committed. Every test under that glob must pass
      # OFFLINE: no database, no network, no secrets, no project ref. If a test ever
      # needs a live database it does not belong here -- put it in supabase/tests/ and
      # let Database Contract Tests run it against the ephemeral stack.
      - name: Test every scripts/test_*.py (offline)
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(scripts/test_*.py)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No scripts/test_*.py found -- the glob or the checkout is wrong." >&2
            exit 1
          fi
          echo "Running ${#FILES[@]} Python test files:"
          printf '  %s\n' "${FILES[@]}"
          python -m unittest "${FILES[@]}"
      # Named explicitly so that deleting or renaming one of these fails the job loudly
      # instead of quietly shrinking the glob above back to a state nobody notices.
      - name: Prove the known Python suites were in that glob
        run: |
          set -euo pipefail
          for f in \
            scripts/test_production_migration_guard.py \
            scripts/test_production_catalog_verification.py \
            scripts/test_post_batch_app_verification.py \
            scripts/test_production_apply_model_review.py
          do
            if [ ! -f "$f" ]; then
              echo "::error::Expected Python test file is missing: $f" >&2
              exit 1
            fi
          done
          echo "All three Python suites present and covered by the glob above."

  # ===========================================================================
  # PREVIEW: BOUNDED, NAMED APPLY (issue #739).
  #
  # WHAT CHANGED AND WHY. This job used to run a BARE `supabase db push`. That
  # had two failure modes, both of them live on 2026-08-11:
  #
  #   1. It could not apply ANYTHING. Preview was missing four migrations, and
  #      one of them (20260810140000) sorts BELOW preview's ledger head
  #      (20260810170000, already applied there). A bare `db push` refuses that
  #      whole queue with "Found local migration files to be inserted before the
  #      last migration on remote database" and exits 1. So the lane was stuck
  #      closed with no operator control at all.
  #   2. The only escape was the CLI's include-all flag, which would have swept
  #      all four pending migrations at once. Those four belong to THREE
  #      different workstreams, including a security migration. "Apply
  #      everything pending" is not a lane; it is the absence of one.
  #
  # (This header spells that flag WITHOUT its two leading dashes on purpose.
  # `test_include_all_is_bounded_and_dry_run_only` bans the literal token by
  # plain text search everywhere above this job, and prose is not exempt from a
  # text search. The exact flag appears in the step comments below, which are
  # inside the job the test allows it in. Do not "fix" the spelling here.)
  #
  # This is now the SAME MECHANISM the production lane already uses, not a second
  # one. `scripts/production_migration_guard.py` is target-agnostic in everything
  # that matters here -- it takes a repo, an allowlist and a REMOTE LEDGER FILE,
  # and it prunes a detached checkout down to exactly `remote-ledger | allowlist`.
  # Point it at preview's ledger and it bounds preview. The bound that makes the
  # include-all flag safe is the FILESYSTEM, never the flag. Reusing this file also
  # means every policy rule inside `parse_allowlist` (HARD_BLOCKED, the AGENTS.md
  # 6.8 bundle, the 6.5 FR hold, the #660 security co-presence rules) applies to
  # preview too. That is deliberate: preview is the rehearsal for production, and
  # a rehearsal that is allowed to assemble a set production would refuse is not
  # a rehearsal.
  #
  # PREVIEW AND PRODUCTION HAVE DIVERGED IN BOTH DIRECTIONS, verified by object on
  # 2026-08-11: preview holds all 23 plm.pmt_* tables and production holds none,
  # while 20260810140000 is applied on production and not on preview. Nothing in
  # this job may assume preview is "production minus N". It reads preview's own
  # ledger every run and judges the allowlist against that and nothing else.
  #
  # THE ALLOWLIST IS REQUIRED FOR BOTH MODES. The old dry-run reported on the
  # whole pending queue, which is not what any subsequent apply would do -- an
  # honest rehearsal has to rehearse the bounded set. `preview_allowlist` is
  # therefore required for dry-run as well, and an empty one fails.
  #
  # DELIBERATELY NOT COPIED FROM THE PRODUCTION LANE:
  #   - `environment:`. Preview is the safe target; a gate that fires on harmless
  #     events trains the approver to click through (issue #646).
  #   - The typed confirmation string and the exact-origin/main-SHA check.
  #   - The model-review step. It is now mandatory on the PRODUCTION lane (it
  #     fails that job if it cannot run) and it needs ANTHROPIC_API_KEY. Preview
  #     is the safe target and does not carry it. Do not add it here.
  # ===========================================================================
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    needs: validate
    runs-on: ubuntu-latest
    env:
      PREVIEW_PROJECT_REF: rjyboqwcdzcocqgmsyel
      PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE: qsllyeztdwjgirsysgai
    steps:
      # FIRST STEP ON PURPOSE, before any credential is used. A lane that can be
      # pointed at the wrong project is worse than no lane, so the ref this job
      # will write to is asserted to be the preview ref AND asserted not to be the
      # production ref, as two independent checks rather than one.
      - name: Assert the target project ref is PREVIEW
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          set -euo pipefail
          echo "PROJECT REF THIS JOB WILL WRITE TO: $PREVIEW_PROJECT_REF"
          if [ "$PREVIEW_PROJECT_REF" != "rjyboqwcdzcocqgmsyel" ]; then
            echo "REFUSED: preview job is not pointed at the preview project ref." >&2
            exit 1
          fi
          if [ "$PREVIEW_PROJECT_REF" = "$PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE" ]; then
            echo "REFUSED: preview job is pointed at PRODUCTION ($PRODUCTION_PROJECT_REF_NEVER_WRITE_HERE)." >&2
            exit 1
          fi
          echo "REF OK: preview = rjyboqwcdzcocqgmsyel (production qsllyeztdwjgirsysgai is not this job's target)."
          if [ -z "${PREVIEW_ALLOWLIST// /}" ]; then
            echo "REFUSED: preview_allowlist is empty. This lane applies ONLY the versions you name, in dry-run and in apply alike. Name them." >&2
            exit 1
          fi
      # fetch-depth: 0 because `production_migration_guard.py prepare` builds the
      # bounded set with `git worktree add --detach <sha>`, which needs the object.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the exact commit under test
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - name: Capture preview migration record (before)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
        run: |
          set -euo pipefail
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/preview-ledger-before.txt"
      # NO SILENT INCLUSION. Before anything is applied, print the exact set this
      # run will apply and the exact set it will leave alone. The skip list is
      # computed from the same two inputs the guard uses -- local files and the
      # preview ledger read seconds ago -- so a reader can see every pending
      # migration this run is choosing NOT to touch, by version.
      - name: Announce the bounded set (apply list and skip list)
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
          # Labels the summary only. It never selects behaviour.
          RUN_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          from pathlib import Path
          from production_migration_guard import local_migrations, parse_remote_versions

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          ledger = Path(os.environ["RUNNER_TEMP"]) / "preview-ledger-before.txt"
          named = [v.strip() for v in os.environ["PREVIEW_ALLOWLIST"].split(",") if v.strip()]
          local = local_migrations(repo)
          remote = parse_remote_versions(ledger)
          pending = sorted(set(local) - remote)

          print("## Preview bounded apply")
          print()
          print(f"Project ref: `{os.environ['PREVIEW_PROJECT_REF']}` (PREVIEW)")
          print(f"Mode: `{os.environ.get('RUN_MODE', 'n/a')}`")
          print(f"Preview ledger rows before: {len(remote)}")
          print()
          print(f"### WILL APPLY ({len(named)} named)")
          for v in named:
              print(f"- {v} {local[v].name if v in local else '(NOT ON DISK)'}")
          skipped = [v for v in pending if v not in set(named)]
          print()
          print(f"### WILL SKIP ({len(skipped)} pending but not named)")
          for v in skipped:
              print(f"- {v} {local[v].name}")
          if not skipped:
              print("- (none)")
          print()
          print("Everything else on disk is already in the preview ledger.")
          PY
      - name: Hard guard preflight
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          # Fails loudly on: an empty allowlist, a non-14-digit entry, a duplicate,
          # an out-of-order list, a version that is NOT ON DISK, a version ALREADY
          # IN THE PREVIEW LEDGER, and any batch whose non-deferrable dependencies
          # cannot resolve. Same code path as production, judged against preview's
          # own ledger.
          #
          # READ THE FAILURE TEXT CAREFULLY. The guard is shared, and its messages
          # are worded for production -- "already applied on production" here means
          # ALREADY APPLIED ON PREVIEW, because `--remote-ledger` is preview's
          # ledger, read by this job seconds ago. The wording is not corrected here
          # because this job does not own scripts/; the check itself is correct.
          python scripts/production_migration_guard.py preflight \
            --repo "$GITHUB_WORKSPACE" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
      - name: Build bounded checkout
        env:
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python scripts/production_migration_guard.py prepare \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/bounded-preview" \
            --commit-sha "$COMMIT_SHA" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
      # THE HONEST DRY-RUN. It runs against the BOUNDED checkout, so what it
      # prints is exactly what an apply of this same allowlist would do -- not the
      # whole pending queue, which is what the old bare `db push --dry-run`
      # reported and which no apply would ever have matched.
      - name: Bounded dry-run
        if: inputs.mode == 'dry-run'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-preview"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          # Re-prove the bound AT THE POINT OF USE, after `link`, as the last
          # command before the push. `prepare` ran in an earlier step.
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-preview" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
          # --include-all is REQUIRED and safe here for the same reason as in the
          # production lane, and for one preview-specific reason: 20260810140000
          # sorts BELOW preview's ledger head, so the CLI refuses it without the
          # flag. The bound is the filesystem -- `prepare` left exactly
          # `remote-ledger | allowlist` on disk. NEVER add this flag to a
          # `supabase db push` that runs in $GITHUB_WORKSPACE.
          supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/preview-dry-run.txt"
          # THE RESOLVED SET MUST EQUAL THE NAMED SET, exactly and in order.
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
            --dry-run-output "$RUNNER_TEMP/preview-dry-run.txt" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
      - name: Bounded apply
        if: inputs.mode == 'apply'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
          PREVIEW_ALLOWLIST: ${{ inputs.preview_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-preview"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-preview" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
          # A FRESH dry-run immediately before the write, verified against the
          # allowlist, so the run proves what it is about to do rather than
          # inheriting an earlier job's claim.
          supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/preview-dry-run.txt"
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
            --dry-run-output "$RUNNER_TEMP/preview-dry-run.txt" \
            --allowlist "$PREVIEW_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/preview-ledger-before.txt"
          # THE WRITE. Preview only.
          supabase db push --include-all 2>&1 | tee "$RUNNER_TEMP/preview-apply.txt"
      # ALWAYS, including after a failed apply -- a partial apply is exactly when
      # the row delta matters most.
      - name: Capture preview migration record (after)
        if: always()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bounded-preview" 2>/dev/null || cd "$GITHUB_WORKSPACE"
          supabase migration list --linked | tee "$RUNNER_TEMP/preview-ledger-after.txt"
      - name: Report the preview ledger delta
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          from pathlib import Path
          from production_migration_guard import parse_remote_versions

          tmp = Path(os.environ["RUNNER_TEMP"])
          before_p, after_p = tmp / "preview-ledger-before.txt", tmp / "preview-ledger-after.txt"
          if not (before_p.exists() and after_p.exists()):
              print("### Preview ledger delta: NOT AVAILABLE (a ledger read did not complete)")
              raise SystemExit(0)
          before, after = parse_remote_versions(before_p), parse_remote_versions(after_p)
          print("### Preview ledger delta")
          print(f"- rows before: {len(before)}")
          print(f"- rows after:  {len(after)}")
          print(f"- added: {', '.join(sorted(after - before)) or '(none)'}")
          print(f"- removed: {', '.join(sorted(before - after)) or '(none)'}")
          PY
      - name: Save preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-migration-${{ inputs.mode }}-${{ steps.commit.outputs.sha }}
          path: |
            ${{ runner.temp }}/preview-ledger-before.txt
            ${{ runner.temp }}/preview-dry-run.txt
            ${{ runner.temp }}/preview-apply.txt
            ${{ runner.temp }}/preview-ledger-after.txt
          if-no-files-found: warn
          retention-days: 90

  # ISSUE #646: this job deliberately has NO `environment:`.
  #
  # It used to carry `environment: production`, which meant Albert was asked to
  # approve every PRACTICE RUN. A gate that fires on harmless events trains the
  # person holding it to click approve without reading -- which is exactly the
  # habit you do not want on the one run that writes to production. The gate now
  # guards ONLY the real change (`production-apply` below).
  #
  # This job cannot write: it runs `supabase db push --dry-run` and nothing else.
  # `supabase link` and `supabase migration list` are reads. If you ever add a
  # mutating command to this job, put the environment back FIRST.
  production-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.mode == 'dry-run'
    needs: validate
    runs-on: ubuntu-latest
    env:
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
    steps:
      - name: Check exact confirmation
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test -n "$REQUESTED_SHA"
          test "$REQUESTED_CONFIRMATION" = "DRY-RUN $REQUESTED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - name: Capture production migration record
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Build bounded checkout
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          python scripts/production_migration_guard.py prepare \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/bounded-production" \
            --commit-sha "$REQUESTED_SHA" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Run and verify bounded dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-production"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          # Re-prove the checkout is still bounded AT THE POINT OF USE, and keep
          # this the LAST command before the push so nothing can run in between.
          # The bound that makes --include-all safe below is the FILESYSTEM, not
          # the flag: `prepare` keeps exactly `remote-ledger | allowlist` on disk
          # and deletes everything else, so --include-all cannot reach a migration
          # that is not on the allowlist. This re-check exists because `prepare`
          # ran in an earlier step, and it sits after `supabase link` so that no
          # question about what `link` may write can make it inert.
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-production" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
          # --include-all is REQUIRED here, and only here. Most of the pending
          # production migrations sort BELOW the remote ledger head, and the CLI
          # refuses to insert those without it. AGENTS.md 5.1(4) licenses this
          # against a verified bounded set; the prohibition is on --include-all
          # against the FULL repo set, which this is not. Never add this flag to
          # a `supabase db push` that runs in $GITHUB_WORKSPACE.
          supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/production-dry-run.txt"
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
            --dry-run-output "$RUNNER_TEMP/production-dry-run.txt" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Save dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-dry-run-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/production-ledger-before.txt
            ${{ runner.temp }}/production-dry-run.txt
          retention-days: 90

  # ===========================================================================
  # PRODUCTION APPLY (issue #617). The only job in this repo that writes to
  # qsllyeztdwjgirsysgai.
  #
  # THREE INDEPENDENT GATES, and none of them is sufficient alone:
  #   1. `production-apply-review` -- deterministic, machine-checkable. The typed
  #      confirmation string, the exact origin/main SHA, and the full guard chain
  #      (parse_allowlist -> HARD_BLOCKED / 6.8 bundle / 6.5 hold / co-presence,
  #      then validate_candidates, then whole-batch preflight). This job FAILS the
  #      run on its own findings.
  #   2. An automatic MODEL REVIEW that posts a technical verdict into the job
  #      summary, where the human approver reads it.
  #      ****** THE VERDICT IS ADVISORY AND MAY NEVER BE THE ONLY GATE. ******
  #      The verdict does not fail the run and does not approve the run. It exists
  #      to put a written technical opinion in front of the human, not to replace
  #      them. If you ever make its VERDICT blocking, you have created a lane where
  #      a model can wave a production write through. Do not.
  #      ****** BUT THE REVIEW ACTUALLY RUNNING IS MANDATORY. ******
  #      If it cannot run (no ANTHROPIC_API_KEY, API failure, empty response) the
  #      step FAILS and this job goes red, so `production-apply` never reaches the
  #      approval gate. A green job that reviewed nothing is a silent failure.
  #   3. `environment: production` -- Albert, as required reviewer, clicking
  #      approve. This is the gate that actually holds. Nothing below it runs
  #      until he does.
  # ===========================================================================
  production-apply-review:
    name: Production apply review (advisory model verdict + hard guards)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.mode == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    env:
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
    steps:
      # FIRST STEP ON PURPOSE. A wrong confirmation string must fail before any
      # credential is used, any checkout happens, and any approval is requested.
      - name: Check exact confirmation
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          test -n "$REQUESTED_SHA"
          test -n "$PRODUCTION_ALLOWLIST"
          test "$REQUESTED_CONFIRMATION" = "APPLY $REQUESTED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - name: Capture production migration record
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Hard guard preflight
        env:
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          python scripts/production_migration_guard.py preflight \
            --repo "$GITHUB_WORKSPACE" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
      # The VERDICT is advisory; the review HAPPENING is mandatory. There is no
      # `continue-on-error` here on purpose: it used to be here, and with
      # ANTHROPIC_API_KEY unset the step printed "NOT RUN" and the job still went
      # green, so every production apply carried a review that had never
      # happened. The script exits non-zero only when the review could not be
      # performed (missing key, empty allowlist, API failure, empty response) --
      # never on the model's opinion. See scripts/production_apply_model_review.py.
      - name: Automatic model review (verdict advisory -- but it MUST run)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Which model reviews is CONFIGURATION, not code. Set the repository
          # (or environment) variable SHARED_DB_REVIEW_MODEL to change it
          # without editing the script; unset, the script uses its own
          # DEFAULT_MODEL, which is a real, working id. A wrong id here fails
          # the job with a message naming the id -- it does not silently pass.
          SHARED_DB_REVIEW_MODEL: ${{ vars.SHARED_DB_REVIEW_MODEL }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: python scripts/production_apply_model_review.py
      - name: Upload pre-approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-apply-review-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/production-ledger-before.txt
            ${{ runner.temp }}/production-model-review.md
          if-no-files-found: warn
          retention-days: 90

  production-apply:
    name: Production apply (requires Albert's approval)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.mode == 'apply'
    needs: [validate, production-apply-review]
    runs-on: ubuntu-latest
    # THE GATE. `production` must list Albert as a required reviewer. Nothing in
    # this job runs until he approves. Do not remove this line, and do not move
    # any writing step out of this job to get around it.
    environment: production
    env:
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
    steps:
      - name: Check exact confirmation
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test -n "$REQUESTED_SHA"
          test "$REQUESTED_CONFIRMATION" = "APPLY $REQUESTED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      # Re-read the ledger IN THIS JOB. The review job's copy was taken before the
      # approval wait, which can be hours; production moves independently of this
      # repo, so a stale ledger would size the bounded checkout wrongly.
      - name: Capture production migration record
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Build bounded checkout
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          python scripts/production_migration_guard.py prepare \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/bounded-production" \
            --commit-sha "$REQUESTED_SHA" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
      - name: Fresh dry-run, then apply
        id: apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
        run: |
          cd "$RUNNER_TEMP/bounded-production"
          supabase link --project-ref "$PRODUCTION_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          set -o pipefail
          # Re-prove the bound AT THE POINT OF USE. What makes --include-all safe
          # is the FILESYSTEM (prepare kept exactly `remote-ledger | allowlist`),
          # never the flag. Keep this the last check before the push.
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" assert-bounded \
            --dir "$RUNNER_TEMP/bounded-production" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
          # A FRESH dry-run inside this same run, immediately before the real
          # push. The earlier production-dry-run job was a different run against a
          # different ledger snapshot; only this one describes the database we are
          # about to write to.
          supabase db push --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/production-dry-run.txt"
          python "$GITHUB_WORKSPACE/scripts/production_migration_guard.py" verify-dry-run \
            --dry-run-output "$RUNNER_TEMP/production-dry-run.txt" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --remote-ledger "$RUNNER_TEMP/production-ledger-before.txt"
          # THE WRITE.
          supabase db push --include-all 2>&1 | tee "$RUNNER_TEMP/production-apply.txt"
      - name: Capture production migration record (after)
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PRODUCTION }}
        run: |
          cd "$RUNNER_TEMP/bounded-production"
          supabase migration list --linked | tee "$RUNNER_TEMP/production-ledger-after.txt"
      # =====================================================================
      # POST-APPLY CATALOG VERIFICATION (issue #697).
      #
      # `supabase db push` DISCARDS `RAISE NOTICE` and every DO-block output,
      # and the step above is a LEDGER read. Without this step the lane can
      # prove that it WROTE but not WHAT it wrote -- after the fully green
      # canary apply, only 2 of 5 basic checks were provable from the
      # artifacts (#677). "The table exists", "it holds exactly one row" and
      # "RLS is on with zero policies" were all inference from reading the
      # SQL. For the licensor batches, which are largely ABOUT grants and RLS,
      # that is not good enough: whether a revoke actually took is a CATALOG
      # FACT, and this is the step that reports it.
      #
      # STRICTLY READ-ONLY. It sends SELECT-only statements to the Supabase
      # Management API `database/query` endpoint with `read_only: true`. It
      # does NOT touch the Supabase CLI, does NOT resolve a binary by version
      # string (#688), and cannot influence `verify_dry_run` (#697 trap list).
      # It uses the SUPABASE_ACCESS_TOKEN already in this job -- no new secret.
      #
      # `if: always()` so a FAILED apply still produces catalog evidence, which
      # is when it is most wanted. The mode switches to `record` in that case:
      # after a failed apply a missing object is already explained, and failing
      # again on it would only add noise to an already-red run.
      # =====================================================================
      - name: Post-apply catalog verification
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_ALLOWLIST: ${{ inputs.production_allowlist }}
          VERIFY_MODE: ${{ steps.apply.outcome == 'success' && 'enforce' || 'record' }}
        run: |
          # pipefail or `tee` swallows the exit code and an ENFORCING failure
          # would silently go green -- the exact defect this step exists to end.
          set -o pipefail
          python scripts/production_catalog_verification.py \
            --repo "$GITHUB_WORKSPACE" \
            --allowlist "$PRODUCTION_ALLOWLIST" \
            --output-dir "$RUNNER_TEMP/catalog-verification" \
            --project-ref "$PRODUCTION_PROJECT_REF" \
            --mode "$VERIFY_MODE" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-apply-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/production-ledger-before.txt
            ${{ runner.temp }}/production-dry-run.txt
            ${{ runner.temp }}/production-apply.txt
            ${{ runner.temp }}/production-ledger-after.txt
            ${{ runner.temp }}/catalog-verification/production-catalog-verification.md
            ${{ runner.temp }}/catalog-verification/production-catalog-verification.json
          if-no-files-found: warn
          retention-days: 90
