# ColdLion licensor/property ALERT MONITOR (PREVIEW ONLY).
#
# The accelerated cutover plan required proof that a failure alert reaches a
# monitoring path within 15 minutes and names Albert Hazan as the human response
# owner. The plan pointed at "the existing Codex heartbeat task" — a 2026-07-27
# sweep of this repository found no such task exists here. This workflow is the
# smallest durable replacement that can actually be proven:
#
#   plm.taxonomy_sync_alert (preview)
#     -> this job, every 10 minutes
#     -> a GitHub Issue naming Albert Hazan + a RED failed workflow run
#
# Both surfaces are permanent and timestamped, so delivery time is provable after
# the fact. 10 minutes < the 15-minute target, leaving room for GitHub queue delay.
#
# Guarded by repository variable COLDLION_ALERT_MONITOR_ENABLED=true (default off),
# exactly like PHASE6_SCHEDULE_ENABLED. Production qsllyeztdwjgirsysgai is hard-refused;
# this monitor watches preview only until a separately approved production window.
#
# Required GitHub secrets (names only — values from 1Password vibe_coding):
#   SUPABASE_ACCESS_TOKEN          — Supabase CLI Personal Access Token
#   SUPABASE_DB_PASSWORD_PREVIEW   — preview branch DB password

name: ColdLion Licensor/Property Alert Monitor (preview)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: coldlion-taxonomy-alert-monitor
  cancel-in-progress: false

env:
  # CONFIGURED, not hard-coded: the preview project ref changes whenever the preview
  # branch is rebuilt (rjyboqwcdzcocqgmsyel was deleted on 2026-08-18). An unset
  # repository variable is REFUSED below, never defaulted. See AGENTS.md rule 2.
  PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
  PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
  HUMAN_RESPONSE_OWNER: Albert Hazan

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse production identity
        run: |
          set -euo pipefail
          if [ "${PREVIEW_PROJECT_REF}" = "${PRODUCTION_PROJECT_REF}" ]; then
            echo "PREVIEW and PRODUCTION refs must differ" >&2
            exit 1
          fi
          if [ -z "${PREVIEW_PROJECT_REF// /}" ]; then
            echo "REFUSED: repository variable PREVIEW_PROJECT_REF is not set. Set it to the CURRENT preview branch project ref. An unset ref is never treated as a default." >&2
            exit 1
          fi
          if ! printf '%s' "${PREVIEW_PROJECT_REF}" | grep -Eq '^[a-z]{20}$'; then
            echo "REFUSED: PREVIEW_PROJECT_REF is not a 20-character Supabase project ref." >&2
            exit 1
          fi
          echo "Target preview project: ${PREVIEW_PROJECT_REF}"

      - name: Gate until the monitor is explicitly enabled
        run: |
          set -euo pipefail
          if [ "${{ vars.COLDLION_ALERT_MONITOR_ENABLED }}" != "true" ]; then
            echo "Alert monitor disabled: set repository variable COLDLION_ALERT_MONITOR_ENABLED=true to enable."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        if: env.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (offline)
        if: env.skip != 'true'
        run: |
          node --test \
            tools/phase6-preview-guards.test.mjs \
            tools/phase6-cli-result-parse.test.mjs \
            tools/dispatch-coldlion-taxonomy-alerts.test.mjs \
            tools/evaluate-coldlion-licensor-property-cutover-readiness.test.mjs

      - name: Setup Supabase CLI
        if: env.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link preview project only
        if: env.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "Missing secret SUPABASE_ACCESS_TOKEN" >&2; exit 1; fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then echo "Missing secret SUPABASE_DB_PASSWORD_PREVIEW" >&2; exit 1; fi
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          LINKED=$(cat supabase/.temp/project-ref)
          if [ "$LINKED" != "$PREVIEW_PROJECT_REF" ]; then
            echo "Linked project $LINKED is not preview $PREVIEW_PROJECT_REF" >&2
            exit 1
          fi

      - name: Collect undelivered alerts
        if: env.skip != 'true'
        id: collect
        env:
          # The dispatcher reads the repository's OPEN issues to decide whether this
          # alert set was already reported (#551). Read-only: `gh issue list` only.
          GH_TOKEN: ${{ github.token }}
          COLDLION_ALERT_ISSUE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +e
          node tools/dispatch-coldlion-taxonomy-alerts.mjs --apply --linked --out alert-plan.json
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # 0 = all clear
          # 1 = alerts found, not yet reported -> create the issue
          # 2 = unparseable probe (fail closed)
          # 3 = alerts found but ALREADY REPORTED on an open issue -> do NOT create a
          #     duplicate; the run still goes red because the alert is still outstanding
          # 4 = alerts found and the DEDUPE CHECK ITSELF FAILED -> create the issue
          #     anyway (never swallow an alert) and shout about the broken dedupe
          if [ "$CODE" -eq 2 ]; then
            echo "::error::ColdLion alert probe was unparseable — failing closed. Human response owner: ${HUMAN_RESPONSE_OWNER}."
            exit 2
          fi
          if [ "$CODE" -eq 3 ]; then
            MATCH=$(node -e "try{process.stdout.write(String(JSON.parse(require('fs').readFileSync('alert-plan.json','utf8')).dedupe_matched_issue??'unknown'))}catch(e){process.stdout.write('unknown')}")
            echo "::warning title=ColdLion alert already reported::This alert set is already open as issue #${MATCH}. No duplicate issue was created (issue #551). The run still fails because the alert is still outstanding. Human response owner: ${HUMAN_RESPONSE_OWNER}."
          fi
          if [ "$CODE" -eq 4 ]; then
            echo "::error title=ColdLion alert DEDUPE CHECK FAILED::The duplicate check could not be completed, so this run cannot prove the alert was already reported. It is delivering the issue anyway — a possible duplicate is strictly better than a swallowed alert. Fix the dedupe lookup. Human response owner: ${HUMAN_RESPONSE_OWNER}."
          fi

      - name: Deliver — open a GitHub issue naming the human response owner
        # Codes 1 and 4 deliver. Code 3 deliberately does NOT: it is already reported.
        if: env.skip != 'true' && (steps.collect.outputs.code == '1' || steps.collect.outputs.code == '4')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('alert-plan.json','utf8')).title)")
          node -e "require('fs').writeFileSync('alert-body.md', JSON.parse(require('fs').readFileSync('alert-plan.json','utf8')).body)"
          {
            echo ""
            echo "Delivered by workflow run ${{ github.run_id }} at $(date -u +%Y-%m-%dT%H:%M:%SZ) (UTC)."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> alert-body.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body-file alert-body.md \
            --label "coldlion-taxonomy-alert" \
            || gh issue create \
                 --repo "${{ github.repository }}" \
                 --title "$TITLE" \
                 --body-file alert-body.md
          echo "::error::ColdLion taxonomy alert delivered. Human response owner: ${HUMAN_RESPONSE_OWNER}."

      - name: Fail loudly when an alert is outstanding
        # 1, 3 and 4 all mean "an alert is outstanding". Deduplicating the ISSUE must
        # never deduplicate the FAILURE: a suppressed duplicate still leaves the run RED.
        if: env.skip != 'true' && (steps.collect.outputs.code == '1' || steps.collect.outputs.code == '3' || steps.collect.outputs.code == '4')
        run: |
          echo "An undelivered ColdLion taxonomy alert exists (dispatcher exit ${{ steps.collect.outputs.code }}). Human response owner: ${HUMAN_RESPONSE_OWNER}." >&2
          exit 1
