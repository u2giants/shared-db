# Guard: at most ONE open orchestrator marker, and an unreadable answer is UNKNOWN.
#
# Plan item B1 of `plan_orchestrator-workflow-gaps.md` (issue #619).
#
# Two orchestrators dispatching at once is how this repo produced four competing
# migrations on one function. The single-orchestrator rule is an honour-system GitHub
# issue, and every way step 0 has asked "is a marker open?" has, at least once, answered
# "no" while one was open — a renamed label, an eventually-consistent server-side label
# filter, and (2026-08-09) `gh issue list` printing empty output while the marker existed.
# `scripts/check-orchestrator-marker.mjs` documents all three.
#
# Design rules, same as the other repo-wide guards here:
#   1. NO `paths:` filter. With one, the PR that matters is exactly the PR that skips the
#      job, and the PR still shows all-checks-passed. AGENTS.md §5.2 records this
#      false-verdict pattern happening in this repo already.
#   2. A UNIQUE check-run name. Three workflows once all exposed a check named `verify`,
#      which is why only one could be made a required context (AGENTS.md §6.7).
#   3. The negative-path tests run FIRST, in the same job. A guard whose own tests are not
#      run is a guard nobody has proven fires.
#
#   4. AND ON A SCHEDULE. Kimi's point, accepted in the plan: a PR-only check sees nothing
#      during the hours when two orchestrators are actually colliding, because neither may
#      open a PR.
#
# ⚠️ TO FINISH B1, AN ADMIN MUST MAKE `Orchestrator marker guard` A REQUIRED CONTEXT.
# Branch protection is not editable from a workflow or by an agent session. Until that is
# done this is advisory, and an advisory check that detects a collision nobody notices is
# the same class of defect it was built to fix.
#
# ⚠️ LIMIT (plan item B1b): this detects a MARKED collision only. A session that never
# claims a marker is invisible to it, and nothing in CI can PREVENT a second orchestrator
# starting — a marker is claimed outside any pull request. It makes a collision VISIBLE,
# not impossible.

name: Orchestrator Marker Guard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every two hours. Collisions happen between PRs, not at them.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: orchestrator-marker-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Orchestrator marker guard
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove the guard fails on two markers, and on an unreadable answer
        run: node --test scripts/check-orchestrator-marker.test.mjs

      - name: Check how many orchestrator markers are open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-orchestrator-marker.mjs

      # ---------------------------------------------------------------------
      # Alarm path for the SCHEDULED leg only.
      #
      # A failed scheduled run mails the commit author, and the mandated
      # committer identity is a `noreply` address — so by default NOBODY is
      # told. The scheduled leg without this step is a silent failure.
      #
      # Throttled and deduplicated, deliberately: this repo has already
      # produced 25 duplicate issues from a monitor with no dedupe. One open
      # alarm issue at a time; if one is already open, comment nothing and add
      # nothing. It is closed by hand once the collision is resolved.
      # ---------------------------------------------------------------------
      - name: Raise ONE throttled alarm issue (scheduled runs only)
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="ORCHESTRATOR MARKER ALARM — the marker check is failing"

          # Enumerate open issues and match the title client-side. A
          # server-side search filter is exactly the eventually-consistent
          # mechanism this guard exists because of: if the dedupe lookup
          # wrongly returns empty, we file a duplicate.
          EXISTING="$(node "$GITHUB_WORKSPACE/scripts/gh-read.mjs" api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.pull_request == null) | select(.title == \"${TITLE}\") | .number] | .[0] // empty")"

          if [ -n "${EXISTING}" ]; then
            echo "Alarm issue #${EXISTING} is already open — not filing another."
            exit 0
          fi

          # Body written to a file: a heredoc terminator must sit at column 0,
          # which cannot be done inline at this indentation without silently
          # producing a mangled body.
          cat > /tmp/alarm-body.md <<BODY
          The scheduled \`Orchestrator marker guard\` run failed.

          Either **more than one \`orchestrator-marker\` issue is open**, or the retired
          \`coordinator-marker\` label is alive again, or the open marker carries no valid
          \`orchestrator-routing\` block (AGENTS.md §11c), or the answer could not be determined.

          If the marker is unroutable, an orchestrator **may be live and unreachable**. That is
          NOT the same as "no orchestrator" — do not start a second one, and do not take a
          routing target from a handoff or from conversation history.

          **Two orchestrators dispatching at once is how this repo produced four competing
          migrations on one function.** Stop dispatching until this is resolved.

          Run: ${RUN_URL}

          Check by hand:

              gh api "repos/${REPO}/issues?state=open&per_page=100" --paginate \\
                --jq '.[] | select(.pull_request == null) | select(.labels[].name=="orchestrator-marker") | .number'

          ⚠️ This detects a MARKED collision only. A session that never claims a marker is
          invisible to it. See \`scripts/check-orchestrator-marker.mjs\`.

          **Close this issue by hand once resolved.** It is throttled: while it is open, no
          further alarm issues are filed, so a second collision would go unannounced.
          BODY

          gh issue create --repo "${REPO}" --label db-work \
            --title "${TITLE}" --body-file /tmp/alarm-body.md
